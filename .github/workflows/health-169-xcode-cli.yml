name: Health169 bounded Xcode CLI only
on:
  push:
    branches: [prep/qualification/health-169-xcode-cli-20261006]
permissions:
  contents: read
jobs:
  xcode-cli:
    runs-on: macos-26
    timeout-minutes: 8
    steps:
      - name: Cloud resource admission (no SDK commands)
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYTHON'
          import os,sys,shutil,subprocess,re,json
          assert os.environ['GITHUB_SHA']==os.environ['GITHUB_WORKFLOW_SHA']
          assert os.environ['RUNNER_ENVIRONMENT']=='github-hosted' and os.environ['RUNNER_OS']=='macOS'
          free=shutil.disk_usage('/').free
          assert free>=8*1024**3
          probe=subprocess.run(['/usr/bin/vm_stat'],capture_output=True,timeout=12,check=True)
          assert len(probe.stdout)<=16384
          text=probe.stdout.decode('utf8')
          page=int(re.search(r'page size of (\d+) bytes',text).group(1))
          counts={name:int(re.search(r'^'+re.escape(name)+r':\s+(\d+)\.',text,re.M).group(1)) for name in ['Pages free','Pages inactive','Pages speculative']}
          reclaimable_estimate=page*sum(counts.values())
          assert reclaimable_estimate>=2*1024**3
          print('HEALTHMD_XCODE_CLI_RESOURCE_ADMISSION '+json.dumps({'disk_free_bytes':free,'python_version':sys.version,'vm_stat_counts':counts,'page_size':page,'free_inactive_speculative_bytes':reclaimable_estimate,'additional_writes_peak_estimate_bytes':500*1024**2,'limits':'vm_stat free+inactive+speculative estimate, not Linux MemAvailable or universal immediately allocatable memory; no installs/builds/SDK queries.'},sort_keys=True),flush=True)
          PYTHON
      - name: Materialize exact CLI controller and cloud syntax check
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYTHON'
          from pathlib import Path
          import base64,hashlib,os
          data=base64.b64decode('',validate=True)
          assert len(data)==7569 and hashlib.sha256(data).hexdigest()=='e9c12f2066fbb4a1588e791c97c707822f800baa81df4a413a98784d21b30fed'
          path=Path(os.environ['RUNNER_TEMP'])/'healthmd-xcode-cli.py'
          assert not path.exists()
          path.write_bytes(data)
          print('HEALTHMD_XCODE_CLI_CONTROLLER_OBSERVED '+str(len(data))+' e9c12f2066fbb4a1588e791c97c707822f800baa81df4a413a98784d21b30fed',flush=True)
          PYTHON
          python3 -m py_compile "$RUNNER_TEMP/healthmd-xcode-cli.py"
      - name: Finite installed Xcode version and explicit pipe closure only
        shell: bash
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/healthmd-xcode-cli.py"
      - name: Final resources (not native acceptance)
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          df -h /
          /usr/bin/vm_stat
