name: Imghost bounded registry metadata stream size diagnostic
on:
  push:
    branches: [prep/qualification/imghost-root-wrangler-stream-20261006]
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Resource and identity admission, no checkout or install
        shell: bash
        run: |
          set -euo pipefail
          df -h /
          free -h
          python3 - <<'PY'
          import os,shutil
          assert os.environ['RUNNER_ENVIRONMENT']=='github-hosted'
          assert os.environ['RUNNER_OS']=='Linux'
          assert os.environ['GITHUB_RUN_ATTEMPT']=='1'
          assert os.environ['GITHUB_SHA']==os.environ['GITHUB_WORKFLOW_SHA']
          assert shutil.disk_usage('/').free>=10*1024**3
          available=next(int(x.split()[1])*1024 for x in open('/proc/meminfo') if x.startswith('MemAvailable:'))
          assert available>=3*1024**3
          PY
      - name: Syntax then finite controls and one bounded identity metadata stream
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/imghost-root-wrangler-stream-owned"
          test ! -e "$root"
          mkdir -m 700 "$root"
          ulimit -f 128
          python3 - "$root/control.py" <<'PY'
          from pathlib import Path
          import base64,hashlib,sys
          data=base64.b64decode('',validate=True)
          assert len(data)==5722 and hashlib.sha256(data).hexdigest()=='72ce4412583f6307859b461f7c667f0838c7b486b9eed31373754ee650a6b9f9'
          path=Path(sys.argv[1])
          assert not path.exists()
          path.write_bytes(data)
          PY
          timeout --kill-after=2s 12s python3 -m py_compile "$root/control.py"
          set +e
          (
            set -C
            timeout --kill-after=2s 90s python3 "$root/control.py" > "$root/console.txt" 2>&1
          )
          status=$?
          set -e
          python3 - "$root/console.txt" "$status" <<'PY'
          from pathlib import Path
          import sys,json,hashlib
          path=Path(sys.argv[1])
          assert path.is_file() and not path.is_symlink() and path.stat().st_size<=128*1024
          data=path.read_bytes()
          print(data.decode(),end='',flush=True)
          print('IMGHOST_REGISTRY_STREAM_RETURN '+json.dumps({'exit_status':sys.argv[2],'output_bytes':len(data),'sha256':hashlib.sha256(data).hexdigest(),'limits':'Raw control stdout/stderr exported before command exit guard. Combined streams, not separate stderr. GNU timeout/file-size limits not owned descendant/global cleanup proof.'},sort_keys=True),flush=True)
          PY
          test "$status" = 0
      - name: Final cloud resource observations
        if: always()
        shell: bash
        run: |
          df -h /
          free -h
