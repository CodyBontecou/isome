name: Imghost root EFBIG npm cache source and metadata headers diagnostic
on:
  push:
    branches: [prep/qualification/imghost-root-wrangler-cache-20261006]
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - name: Cloud resource admission before runtime setup
        shell: bash
        run: |
          set -euo pipefail
          df -h /
          free -h
          python3 - <<'PY'
          import os,shutil
          assert os.environ['RUNNER_ENVIRONMENT']=='github-hosted'
          assert os.environ['RUNNER_OS']=='Linux'
          assert os.environ['GITHUB_RUN_ATTEMPT']=='1'
          assert os.environ['GITHUB_SHA']==os.environ['GITHUB_WORKFLOW_SHA']
          assert shutil.disk_usage('/').free>=10*1024**3
          available=next(int(x.split()[1])*1024 for x in open('/proc/meminfo') if x.startswith('MemAvailable:'))
          assert available>=3*1024**3
          PY
      - name: Pinned existing runtime family only, no project checkout or dependencies
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.3'
          check-latest: false
      - name: Materialize literal tool source inspector and observe actual file limit
        shell: bash
        run: |
          set -euo pipefail
          test "$(node --version)" = v22.23.3
          test "$(npm --version)" = 10.9.9
          root="$RUNNER_TEMP/imghost-root-wrangler-cache-control"
          test ! -e "$root"
          mkdir -m 700 "$root"
          python3 - "$root/inspect.cjs" <<'PY'
          from pathlib import Path
          import sys,base64,hashlib
          encoded=''
          data=base64.b64decode(encoded,validate=True)
          assert len(data)==3812 and hashlib.sha256(data).hexdigest()=='842bfb5585807a56903bf4ebb82f50c474c385d69bdb1c0bebff8cfcce853c13'
          path=Path(sys.argv[1])
          assert not path.exists()
          path.write_bytes(data)
          PY
          timeout --kill-after=2s 12s node --check "$root/inspect.cjs"
          (
            ulimit -f 8192
            python3 - <<'PY'
          import json,os,resource
          print('IMGHOST_NPM_CACHE_FILE_LIMIT '+json.dumps({'shell_value':8192,'rlimit_fsize_bytes':resource.getrlimit(resource.RLIMIT_FSIZE),'bash_version':os.environ.get('BASH_VERSION'),'limits':'Observed fresh shell process file-size guard; not the earlier failed process exact file or response-size attribution.'},sort_keys=True),flush=True)
          PY
          )
          set +e
          (
            set -C
            ulimit -f 4096
            timeout --kill-after=2s 12s node "$root/inspect.cjs" "$(command -v npm)" > "$root/inspector.log" 2>&1
          )
          status=$?
          set -e
          python3 - "$root/inspector.log" "$status" <<'PY'
          from pathlib import Path
          import sys,hashlib,json
          path=Path(sys.argv[1])
          assert path.is_file() and not path.is_symlink() and path.stat().st_size<=1024*1024
          data=path.read_bytes()
          print(data.decode(),end='',flush=True)
          print('IMGHOST_NPM_CACHE_INSPECTOR_RETURN '+json.dumps({'exit_status':sys.argv[2],'output_bytes':len(data),'sha256':hashlib.sha256(data).hexdigest(),'limits':'Completed bounded tool-source console before exit gate. Source paths/hashes are not loaded module/binary attestation; timeout/file limits not owned descendant/global cleanup proof.'},sort_keys=True),flush=True)
          PY
          test "$status" = 0
      - name: Two exact registry HEAD variants with identity encoding and no body downloads
        shell: bash
        run: |
          set -euo pipefail
          timeout --kill-after=2s 40s python3 - <<'PY'
          import datetime,http.client,json
          host='registry.npmjs.org'
          for label,accept in [('full-json','application/json'),('install-v1','application/vnd.npm.install-v1+json')]:
              connection=http.client.HTTPSConnection(host,timeout=12)
              started=datetime.datetime.now(datetime.timezone.utc).isoformat()
              connection.request('HEAD','/wrangler',headers={'Accept':accept,'Accept-Encoding':'identity','User-Agent':'issue-factory-npm-metadata-headers-only'})
              response=connection.getresponse()
              headers=response.getheaders()
              assert len(headers)<=64 and sum(len(k)+len(v) for k,v in headers)<=16384
              selected={name:response.getheader(name) for name in ['Content-Length','Content-Type','Content-Encoding','ETag','Vary','Transfer-Encoding','Date','Cache-Control']}
              observation={'label':label,'method':'HEAD','host':host,'path':'/wrangler','request_accept':accept,'request_accept_encoding':'identity','status':response.status,'started_utc':started,'headers':selected,'body_read':False,'limits':'Fresh HEAD representation metadata only. No body/download/cache write/npm generation/audit or earlier-response size/encoding/Accept/cache-file attribution. Missing/encoded length is not a justified decompressed-cache bound.'}
              print('IMGHOST_NPM_CACHE_HEADERS '+json.dumps(observation,sort_keys=True),flush=True)
              status=response.status
              response.close()
              connection.close()
              assert status==200
          PY
      - name: Final resource observations
        if: always()
        shell: bash
        run: |
          df -h /
          free -h
