name: Health cadence direct frontend version diagnostic
on:
  push:
    branches: [prep/qualification/health-cadence-swift-frontend-20261005]
    paths: [.github/workflows/health-cadence-swift-frontend.yml]
permissions:
  contents: read
concurrency:
  group: health-cadence-swift-frontend-${{ github.ref }}
  cancel-in-progress: false
jobs:
  direct-frontend-metadata:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GITHUB_WORKFLOW_SHA: ${{ github.workflow_sha }}
    steps:
      - name: Inspect observed installation and one owned frontend metadata call
        shell: bash
        run: |
          set -euo pipefail
          df -h /
          python3 - <<'PYTHON'
          import base64,hashlib,os,pathlib
          root=pathlib.Path(os.environ['RUNNER_TEMP'])
          assert root.is_absolute() and root.is_dir() and not root.is_symlink()
          raw=base64.b64decode("",validate=True)
          assert hashlib.sha256(raw).hexdigest()=="958e0fb2357f8c4b3c918487eeddac62c067be9c41a5c080cd40ca4934d624df"
          with (root/"health-cadence-owned-sdk-helper.py").open("xb") as stream: stream.write(raw)
          raw=base64.b64decode("",validate=True)
          assert hashlib.sha256(raw).hexdigest()=="cf5eea105538c2269a53d07cf37fa7325b066ed0b0721b13ee829ecbc5849194"
          with (root/"health-cadence-swift-frontend-diagnostic.py").open("xb") as stream: stream.write(raw)
          PYTHON
          python3 "$RUNNER_TEMP/health-cadence-swift-frontend-diagnostic.py"
          echo 'SWIFT_FRONTEND_LIMITS direct version metadata only; no driver retry, compiler/test invocation, SDK/native workflow or product-ref/PR adoption'
