name: Health169 finite build process runner controls
on:
  push:
    branches: [prep/qualification/health-169-build-runner-20261006]
permissions:
  contents: read
jobs:
  build-runner:
    runs-on: macos-26
    timeout-minutes: 8
    steps:
      - name: Cloud resource admission (no SDK commands)
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYTHON'
          import os,sys,shutil,subprocess,re,json
          assert os.environ['GITHUB_SHA']==os.environ['GITHUB_WORKFLOW_SHA']
          assert os.environ['RUNNER_ENVIRONMENT']=='github-hosted' and os.environ['RUNNER_OS']=='macOS'
          free=shutil.disk_usage('/').free
          assert free>=8*1024**3
          probe=subprocess.run(['/usr/bin/vm_stat'],capture_output=True,timeout=12,check=True)
          assert len(probe.stdout)<=16384
          text=probe.stdout.decode('utf8')
          page=int(re.search(r'page size of (\d+) bytes',text).group(1))
          counts={name:int(re.search(r'^'+re.escape(name)+r':\s+(\d+)\.',text,re.M).group(1)) for name in ['Pages free','Pages inactive','Pages speculative']}
          reclaimable_estimate=page*sum(counts.values())
          assert reclaimable_estimate>=2*1024**3
          print('HEALTHMD_BUILD_RUNNER_RESOURCE_ADMISSION '+json.dumps({'disk_free_bytes':free,'python_version':sys.version,'vm_stat_counts':counts,'page_size':page,'free_inactive_speculative_bytes':reclaimable_estimate,'additional_writes_peak_estimate_bytes':500*1024**2,'limits':'vm_stat free+inactive+speculative estimate, not Linux MemAvailable or universal immediately allocatable memory; no installs/builds/SDK queries.'},sort_keys=True),flush=True)
          PYTHON
      - name: Materialize exact source pair and cloud syntax check
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYTHON'
          from pathlib import Path
          import base64,hashlib,os
          rows=[{'source': 'health-md-169-build-runner-20261006.py', 'target': 'healthmd-build-runner.py', 'bytes': 7443, 'sha256': '5d9d1b4875bca9685c490445c59367d0f5917c7676cd6cd60d2939a48c5f19af', 'base64': ''}, {'source': 'health-md-169-build-runner-controls-20261006.py', 'target': 'healthmd-build-runner-controls.py', 'bytes': 7293, 'sha256': '1ca1f81d8d52b8b698eb3664b6f64749327d5a79c1165426226917a1c720a1b9', 'base64': ''}]
          for row in rows:
              data=base64.b64decode(row['base64'],validate=True)
              assert len(data)==row['bytes'] and hashlib.sha256(data).hexdigest()==row['sha256']
              path=Path(os.environ['RUNNER_TEMP'])/row['target']
              assert not path.exists()
              path.write_bytes(data)
              print('HEALTHMD_BUILD_RUNNER_SOURCE_OBSERVED '+row['target']+' '+str(len(data))+' '+row['sha256'],flush=True)
          PYTHON
          python3 -m py_compile "$RUNNER_TEMP/healthmd-build-runner.py" "$RUNNER_TEMP/healthmd-build-runner-controls.py"
      - name: Six synthetic root and pipe controls (no SDK invocation)
        shell: bash
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/healthmd-build-runner-controls.py"
      - name: Final resources (not native or compiler acceptance)
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          df -h /
          /usr/bin/vm_stat
