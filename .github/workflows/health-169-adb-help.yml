name: Android ADB bounded help and version control
on:
  push:
    branches: [prep/qualification/health-169-adb-help-20261006]
    paths: [.github/workflows/health-169-adb-help.yml]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  adb-help-version:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Resource admission before SDK bootstrap
        shell: bash
        run: |
          set -euo pipefail
          df -h /
          free -h
          uptime
          python3 - <<'PY'
          import shutil
          from pathlib import Path
          memory = dict(line.split(':', 1) for line in Path('/proc/meminfo').read_text().splitlines())
          if shutil.disk_usage('/').free < 8*1024**3 or int(memory['MemAvailable'].split()[0])*1024 < 2*1024**3:
              raise RuntimeError('Cloud SDK control admission STOP')
          print('HEALTHMD_ADB_RESOURCE_ESTIMATE: <=500MiB additional bootstrap/control disk estimate, not allocation guarantee')
          PY
      - name: Materialize byte-pinned helper and Linux caller (no product source)
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']).resolve(strict=True)
          for name, size, digest, encoded in [('healthmd-sdk-helper.py', 5956, '958e0fb2357f8c4b3c918487eeddac62c067be9c41a5c080cd40ca4934d624df', ''), ('healthmd-adb-control.py', 3863, '1a3ffcfd252c3faf43cb2b8bd1aab5006413f339e73984a313edec45b0d72945', '')]:
              data = base64.b64decode(encoded, validate=True)
              if len(data) != size or hashlib.sha256(data).hexdigest() != digest:
                  raise RuntimeError('SDK control materialization bytes STOP')
              with (root/name).open('xb') as output:
                  output.write(data)
              if (root/name).read_bytes() != data:
                  raise RuntimeError('SDK control materialization readback STOP')
          PY
          python3 -m py_compile "$RUNNER_TEMP/healthmd-sdk-helper.py" "$RUNNER_TEMP/healthmd-adb-control.py"
      - name: Select installed Android platform-tools (no emulator)
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: platform-tools
      - name: Execute only bounded adb version and help
        shell: bash
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/healthmd-adb-control.py"
      - name: Final resource observation (not cleanup or native acceptance)
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          df -h /
          free -h
          echo 'HEALTHMD_ADB_BOUNDARY: only version/help under unchanged 12-second direct-child/2-second failed-root reap/64KiB post-return output limits. Buffering/caps/PID/file hashes do not prove preemptive allocation, loaded-image/package origin, ECHILD, descendants, services, devices or global cleanup. No server/devices/AVD/emulator/native apps/Apple SDK resume/artifact retention/adoption. Product and goal incomplete.'
