name: Paired Android emulator libpulse repair and bounded CLI controls
on:
  push:
    branches: [prep/qualification/health-169-emulator-libpulse-20261006]
    paths: [.github/workflows/health-169-emulator-libpulse.yml]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  emulator-help-version:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Resource admission before SDK bootstrap
        shell: bash
        run: |
          set -euo pipefail
          df -h /
          free -h
          uptime
          python3 - <<'PY'
          import shutil
          from pathlib import Path
          memory = dict(line.split(':', 1) for line in Path('/proc/meminfo').read_text().splitlines())
          if shutil.disk_usage('/').free < 16*1024**3 or int(memory['MemAvailable'].split()[0])*1024 < 4*1024**3:
              raise RuntimeError('Cloud SDK control admission STOP')
          print('HEALTHMD_ADB_RESOURCE_ESTIMATE: <=6GiB SDK plus256MiB apt additional peak disk estimate, not allocation guarantee')
          PY
      - name: Materialize byte-pinned helper and Linux caller (no product source)
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']).resolve(strict=True)
          for name, size, digest, encoded in [('healthmd-sdk-helper.py', 5956, '958e0fb2357f8c4b3c918487eeddac62c067be9c41a5c080cd40ca4934d624df', ''), ('healthmd-emulator-control.py', 4143, '9c18f9030d34e96a0f862d8ef331a8b9b948313966d4a14a114699533408a68c', ''), ('healthmd-sdk-failure-helper.py', 6135, 'c65f9c4508de2c6af1c681f41d25c000608ac01aa26d67e01d2a1b9357d4eba6', ''), ('healthmd-emulator-negative.py', 4219, '953960b3334780ac174c3dd3ce65b6f2b7d4cc54182319b6266f1ed9128bbd97', '')]:
              data = base64.b64decode(encoded, validate=True)
              if len(data) != size or hashlib.sha256(data).hexdigest() != digest:
                  raise RuntimeError('SDK control materialization bytes STOP')
              with (root/name).open('xb') as output:
                  output.write(data)
              if (root/name).read_bytes() != data:
                  raise RuntimeError('SDK control materialization readback STOP')
          PY
          python3 -m py_compile "$RUNNER_TEMP/healthmd-sdk-helper.py" "$RUNNER_TEMP/healthmd-emulator-control.py" "$RUNNER_TEMP/healthmd-sdk-failure-helper.py" "$RUNNER_TEMP/healthmd-emulator-negative.py"
      - name: Select installed Android platform-tools (no emulator)
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: platform-tools emulator
      - name: Post-install admission before CLI controls
        shell: bash
        run: |
          set -euo pipefail
          df -h /
          free -h
          python3 - <<'PY'
          import shutil
          from pathlib import Path
          m = dict(line.split(':',1) for line in Path('/proc/meminfo').read_text().splitlines())
          if shutil.disk_usage('/').free < 8*1024**3 or int(m['MemAvailable'].split()[0])*1024 < 2*1024**3:
              raise RuntimeError('Post emulator install resource STOP')
          PY
      - name: Reproduce exact bounded missing-libpulse failure before repair
        run: python3 "$RUNNER_TEMP/healthmd-emulator-negative.py"
      - name: Install only named SDK loader dependency and record package metadata
        shell: bash
        run: |
          set -euo pipefail
          df -h /
          free -h
          uptime
          sudo apt-get update -o Acquire::Retries=0 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30
          sudo apt-get install --no-install-recommends -y -o Acquire::Retries=0 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 libpulse0
          echo HEALTHMD_LIBPULSE_PACKAGE_BEGIN
          dpkg-query -W -f='${Package} ${Version} ${Architecture} ${db:Status-Status}\n' libpulse0
          dpkg-query -L libpulse0
          echo HEALTHMD_LIBPULSE_PACKAGE_END
          python3 - <<'PY'
          import shutil
          from pathlib import Path
          m = dict(line.split(':',1) for line in Path('/proc/meminfo').read_text().splitlines())
          if shutil.disk_usage('/').free < 8*1024**3 or int(m['MemAvailable'].split()[0])*1024 < 2*1024**3:
              raise RuntimeError('Post libpulse repair resource STOP')
          PY
      - name: Execute only installed emulator version and four help topics
        shell: bash
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/healthmd-emulator-control.py"
      - name: Final resource observation (not cleanup or native acceptance)
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          df -h /
          free -h
          echo 'HEALTHMD_EMULATOR_BOUNDARY: installed version/help/environment/report-console/port only under unchanged12s roots2s failed reaps64KiB postreturncaps. No AVD/image/guestboot/ADBserver/devices/app/IME/AppleSDKresume/providerreplacement/adoption; no universalcleanup orbinaryorigin proof; goal incomplete.'
