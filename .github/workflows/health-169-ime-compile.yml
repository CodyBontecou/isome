name: Health169 IME diagnostic compile-only qualification
on:
  push:
    branches: [prep/qualification/health-169-ime-compile-20261006]
    paths: [.github/workflows/health-169-ime-compile.yml]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  compile-diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: '2'
      HEALTHMD_SOURCE_ROOT: ${{ github.workspace }}/healthmd-tested
      HEALTHMD_SOURCE_PINS_SHA256: 036f5beefdb968f3aadb564e2cab66266b90646ecccad35098b17e5d18a20a3b
      HEALTHMD_LITERAL_EDITS_SHA256: 03645f92b5ffa4a4a963580a560d3ac0e94c28a3d08290541d74041927fae213
    steps:
      - name: Resource preflight before checkout or downloads
        shell: bash
        run: |
          set -euo pipefail
          df -h /
          free -h
          uptime
          python3 - <<'PY'
          import shutil
          from pathlib import Path
          mem = dict(line.split(':', 1) for line in Path('/proc/meminfo').read_text().splitlines())
          free = shutil.disk_usage('/').free
          available = int(mem['MemAvailable'].split()[0])*1024
          if free < 15*1024**3 or available < 4*1024**3:
              raise RuntimeError('Cloud resource admission STOP')
          print('HEALTHMD_CLOUD_RESOURCE_ADMISSION', {'free_disk_bytes':free, 'available_memory_bytes':available, 'estimated_peak_additional_disk_bytes':12*1024**3, 'limits':'Estimate not preemptive allocation guarantee; keep 3GiB floor and recheck.'})
          PY
      - name: Checkout immutable Health base (runner-only patches follow)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: CodyBontecou/health-md
          ref: 1dfd7f49dd5e7b7d39228b50a6763cb8a8342ff7
          path: healthmd-tested
          fetch-depth: 1
          persist-credentials: false
          lfs: false
          submodules: false
      - name: Materialize byte-pinned compile-only qualification sources
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, os, pathlib, json, sys
          root = pathlib.Path(os.environ['RUNNER_TEMP']).resolve(strict=True)
          sources = [('healthmd-controller.py', 7691, 'a38d9bf000b5bff8bb44d6cfbc7a9b292344338ca82fc38ae664f77859b3ad4f', ''), ('healthmd-source-pins.json', 3427, '036f5beefdb968f3aadb564e2cab66266b90646ecccad35098b17e5d18a20a3b', ''), ('healthmd-ime-candidate.kt', 39804, '2d34d023025181be2d6cb062b4c619618a0aa23f5059263c656922bf387f2eab', ''), ('healthmd-ime-edits.json', 4107, '03645f92b5ffa4a4a963580a560d3ac0e94c28a3d08290541d74041927fae213', '')]
          for name, size, digest, encoded in sources:
              data = base64.b64decode(encoded, validate=True)
              if len(data) != size or hashlib.sha256(data).hexdigest() != digest:
                  raise RuntimeError('Qualification materialization bytes STOP')
              path = root/name
              with path.open('xb') as output:
                  output.write(data)
              if path.read_bytes() != data:
                  raise RuntimeError('Qualification materialization readback STOP')
          print('HEALTHMD_COMPILE_CONTROLLER_RUNTIME', json.dumps({'python':sys.version, 'executable':sys.executable, 'probe_sha':os.environ['GITHUB_SHA'], 'workflow_sha':os.environ['GITHUB_WORKFLOW_SHA'], 'test_execution':False}))
          PY
          python3 -m py_compile "$RUNNER_TEMP/healthmd-controller.py"
          python3 "$RUNNER_TEMP/healthmd-controller.py" prepare
      - name: Select Java 17 test/build toolchain
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
          check-latest: false
      - name: Android SDK tools (no emulator)
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: platform-tools
      - name: Gradle wrapper validation and read-only cache
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          cache-read-only: true
          dependency-graph: disabled
          build-scan-publish: false
      - name: Install real pinned Android and Rust prerequisites
        shell: bash
        run: |
          set -euo pipefail
          df -h /
          free -h
          sdkmanager "platforms;android-36" "build-tools;35.0.0" "ndk;27.1.12297006"
          printf 'ANDROID_NDK_HOME=%s/ndk/27.1.12297006\nANDROID_NDK_ROOT=%s/ndk/27.1.12297006\n' "$ANDROID_SDK_ROOT" "$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          rustup toolchain install 1.88.0 --profile minimal
          rustup target add --toolchain 1.88.0 aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android
          rustup run 1.88.0 cargo install cargo-ndk --version 4.1.2 --locked
          java -version
          rustup run 1.88.0 rustc -Vv
          rustup run 1.88.0 cargo ndk --version
      - name: Compile full play AndroidTest debug candidate (no emulator)
        shell: bash
        run: |
          set -euo pipefail
          df -h /
          free -h
          python3 - <<'PY'
          import shutil
          from pathlib import Path
          mem = dict(line.split(':', 1) for line in Path('/proc/meminfo').read_text().splitlines())
          if shutil.disk_usage('/').free < 3*1024**3 or int(mem['MemAvailable'].split()[0])*1024 < 2*1024**3:
              raise RuntimeError('Cloud pre-build resource floor STOP')
          PY
          python3 "$RUNNER_TEMP/healthmd-controller.py" play
      - name: Compile full fdroid AndroidTest debug candidate (no emulator)
        shell: bash
        run: |
          set -euo pipefail
          df -h /
          free -h
          python3 - <<'PY'
          import shutil
          from pathlib import Path
          mem = dict(line.split(':', 1) for line in Path('/proc/meminfo').read_text().splitlines())
          if shutil.disk_usage('/').free < 3*1024**3 or int(mem['MemAvailable'].split()[0])*1024 < 2*1024**3:
              raise RuntimeError('Cloud pre-build resource floor STOP')
          PY
          python3 "$RUNNER_TEMP/healthmd-controller.py" fdroid
      - name: Final resource observations (not process-cleanup or test proof)
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          df -h /
          free -h
          echo 'HEALTHMD_COMPILE_ONLY_BOUNDARY: full debug AndroidTest assemble with one runner-only diagnostic candidate; standard debug packaging/signing only, no distribution signing/release/upload/artifact retention/emulator/native tests. Selected fresh class digests are not loaded-module/runtime/IME/visibility/device/security/adoption or goal acceptance. Provider timeout and runner disposal are not global process/SDK service absence proof.'
