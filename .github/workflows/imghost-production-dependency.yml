name: Imghost minimum production fflate compatibility and advisory qualification
on:
  push:
    branches: [prep/qualification/imghost-production-dependency-20261006]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      max-parallel: 1
      fail-fast: true
      matrix:
        include:
          - pr: '8'
            head: 553d78a79cc26637d870e0bbf0c052cd1c006f87
          - pr: '9'
            head: c132ecaaa55f64a6d5ce3df70b183cdb55a8cff3
    env:
      IMGHOST_PR: ${{ matrix.pr }}
      IMGHOST_SOURCE_HEAD: ${{ matrix.head }}
      NO_COLOR: '1'
      FORCE_COLOR: '0'
      NPM_CONFIG_REGISTRY: https://registry.npmjs.org
    steps:
      - name: Cloud resource admission before downloads
        shell: bash
        run: |
          set -euo pipefail
          df -h /
          free -h
          python3 - <<'PYTHON'
          import os,shutil
          assert os.environ['GITHUB_SHA']==os.environ['GITHUB_WORKFLOW_SHA']
          assert os.environ['RUNNER_ENVIRONMENT']=='github-hosted'
          assert shutil.disk_usage('/').free>=10*1024**3
          available=next(int(x.split()[1])*1024 for x in open('/proc/meminfo') if x.startswith('MemAvailable:'))
          assert available>=3*1024**3
          PYTHON
      - name: Checkout immutable backend source and four existing manifests
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: CodyBontecou/imghost
          ref: ${{ matrix.head }}
          path: imghost-source
          fetch-depth: 1
          lfs: false
          submodules: false
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /package.json
            /package-lock.json
            /backend/img-host/
      - name: Exact existing Node runtime family
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.3'
          check-latest: false
      - name: Materialize pinned controller and cloud syntax check
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYTHON'
          import os,base64,hashlib,json
          from pathlib import Path
          row={'name': 'controller.py', 'bytes': 7849, 'sha256': 'd07ad3fb01d0b9f8afe9b03b5b79cbe4ab5c75b8e7e7a6641d83da81c1d28eb9', 'base64': ''}
          data=base64.b64decode(row['base64'],validate=True)
          assert len(data)==row['bytes'] and hashlib.sha256(data).hexdigest()==row['sha256']
          path=Path(os.environ['RUNNER_TEMP'])/'imghost-dependency-controller.py'
          assert not path.exists()
          path.write_bytes(data)
          print('IMGHOST_DEPENDENCY_CONTROLLER_SOURCE '+json.dumps({k:v for k,v in row.items() if k!='base64'},sort_keys=True),flush=True)
          PYTHON
          python3 -m py_compile "$RUNNER_TEMP/imghost-dependency-controller.py"
          test "$(node --version)" = v22.23.3
          test "$(npm --version)" = 10.9.9
          python3 "$RUNNER_TEMP/imghost-dependency-controller.py" before
      - name: Generate minimum fixed lock in cloud, no install scripts
        working-directory: imghost-source/backend/img-host
        shell: bash
        run: |
          set -euo pipefail
          timeout --kill-after=2s 120s npm install fflate@0.8.3 --package-lock-only --ignore-scripts --legacy-peer-deps --no-audit --no-fund
          python3 "$RUNNER_TEMP/imghost-dependency-controller.py" generated
      - name: Install exact candidate lock and preserve all other dependencies
        working-directory: imghost-source/backend/img-host
        shell: bash
        run: |
          set -euo pipefail
          timeout --kill-after=2s 180s npm ci --legacy-peer-deps --no-audit --no-fund
          python3 "$RUNNER_TEMP/imghost-dependency-controller.py" installed
      - name: Full unchanged backend suite, original two-worker limit
        working-directory: imghost-source/backend/img-host
        shell: bash
        run: |
          set -euo pipefail
          timeout --kill-after=2s 180s npm test -- --maxWorkers=2 --reporter=verbose | tee "$RUNNER_TEMP/imghost-dependency-$IMGHOST_PR/tests.log"
      - name: Production advisory gate and exact candidate text export
        working-directory: imghost-source/backend/img-host
        shell: bash
        run: |
          set -euo pipefail
          timeout --kill-after=2s 120s npm audit --package-lock-only --omit=dev --ignore-scripts --legacy-peer-deps --json > "$RUNNER_TEMP/imghost-dependency-$IMGHOST_PR/audit-production.json"
          python3 "$RUNNER_TEMP/imghost-dependency-controller.py" finished
      - name: Final host resource observation
        if: always()
        shell: bash
        run: |
          df -h /
          free -h
