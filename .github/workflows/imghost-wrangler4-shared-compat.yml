name: Imghost exact Wrangler4 shared dependencies original268 compatibility and audit qualification
on:
  push:
    branches: [prep/qualification/imghost-wrangler4-shared-compat-20261006]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      max-parallel: 1
      fail-fast: true
      matrix:
        include:
          - pr: '9'
            head: c132ecaaa55f64a6d5ce3df70b183cdb55a8cff3
    env:
      IMGHOST_PR: ${{ matrix.pr }}
      IMGHOST_SOURCE_HEAD: ${{ matrix.head }}
      NO_COLOR: '1'
      FORCE_COLOR: '0'
      NPM_CONFIG_REGISTRY: https://registry.npmjs.org
    steps:
      - name: Cloud resource admission before downloads
        shell: bash
        run: |
          set -euo pipefail
          df -h /
          free -h
          python3 - <<'PYTHON'
          import os,shutil
          assert os.environ['GITHUB_SHA']==os.environ['GITHUB_WORKFLOW_SHA']
          assert os.environ['RUNNER_ENVIRONMENT']=='github-hosted'
          assert shutil.disk_usage('/').free>=10*1024**3
          available=next(int(x.split()[1])*1024 for x in open('/proc/meminfo') if x.startswith('MemAvailable:'))
          assert available>=3*1024**3
          PYTHON
      - name: Checkout immutable complete backend source and root manifests
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: CodyBontecou/imghost
          ref: ${{ matrix.head }}
          path: imghost-source
          fetch-depth: 1
          lfs: false
          submodules: false
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /package.json
            /package-lock.json
            /backend/img-host/
      - name: Exact existing Node runtime family
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.3'
          check-latest: false
      - name: Materialize pinned controller and original named terminal inventories
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYTHON'
          import os,base64,hashlib,json
          from pathlib import Path
          rows=[{'name': 'imghost-vitest-controller.py', 'bytes': 18828, 'sha256': '8833cc60fc997356116718ba5ef5fb09a6a623459a17bdee6a3ce2c0d0d3b744', 'base64': ''}, {'name': 'imghost-vitest-expected-names.json', 'bytes': 36503, 'sha256': 'eadd840ecf1ab64b506c87faa5dd650edb993f0874690fbc9ef471c25825e4e0', 'base64': ''}, {'name': 'imghost-wrangler-baseline-package.json', 'bytes': 2276, 'sha256': '50c92f15b750e9554fedae70434c63eea8932dc7b642d1f7cd45942f27af5552', 'base64': ''}, {'name': 'imghost-wrangler-baseline-lock.json', 'bytes': 100339, 'sha256': '2b41d0c2c4068aa73f83c8c19b103670e95941021a8b6ffe952ca5beec209c67', 'base64': ''}, {'name': 'imghost-wrangler-candidate-package.json', 'bytes': 2276, 'sha256': 'bf169a806cfe5c35f48e4fcb87de59ed93fe1b6e8a7436d18dcb4761c3105ebc', 'base64': ''}, {'name': 'imghost-wrangler-candidate-lock.json', 'bytes': 97236, 'sha256': 'ec03e1e46112328f46cd345f9f564afd7b305798de4c4e0c60d6a299cc3089d5', 'base64': ''}]
          for row in rows:
              data=base64.b64decode(row['base64'],validate=True)
              assert len(data)==row['bytes'] and hashlib.sha256(data).hexdigest()==row['sha256']
              path=Path(os.environ['RUNNER_TEMP'])/row['name']
              assert not path.exists()
              path.write_bytes(data)
              print('IMGHOST_WRANGLER_COMPAT_SOURCE '+json.dumps({k:v for k,v in row.items() if k!='base64'},sort_keys=True),flush=True)
          PYTHON
          python3 -m py_compile "$RUNNER_TEMP/imghost-vitest-controller.py"
          test "$(node --version)" = v22.23.3
          test "$(npm --version)" = 10.9.9
          node --version
          npm --version
          python3 "$RUNNER_TEMP/imghost-vitest-controller.py" before
      - name: Apply exact saved Wrangler4 pair and require exact28 shared node admission
        working-directory: imghost-source/backend/img-host
        shell: bash
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/imghost-vitest-controller.py" materialize
          python3 "$RUNNER_TEMP/imghost-vitest-controller.py" verified
      - name: Install exact candidate lock with existing install policy
        working-directory: imghost-source/backend/img-host
        shell: bash
        run: |
          set -euo pipefail
          timeout --kill-after=2s 180s npm ci --legacy-peer-deps --no-audit --no-fund
          python3 "$RUNNER_TEMP/imghost-vitest-controller.py" installed
      - name: Full unchanged original suite and two-worker limit with additive machine reporter
        working-directory: imghost-source/backend/img-host
        shell: bash
        run: |
          set -euo pipefail
          set +e
          timeout --kill-after=2s 180s npm test -- --maxWorkers=2 --reporter=verbose --reporter=json --outputFile="$RUNNER_TEMP/imghost-vitest-$IMGHOST_PR/tests.json" | tee "$RUNNER_TEMP/imghost-vitest-$IMGHOST_PR/tests.log"
          statuses=("${PIPESTATUS[@]}")
          set -e
          printf '%s\n' "${statuses[0]}" > "$RUNNER_TEMP/imghost-vitest-$IMGHOST_PR/tests.exit"
          test "${statuses[1]}" = 0
      - name: Export UNADOPTED machine and keyed audit reports then require all semantic gates
        working-directory: imghost-source/backend/img-host
        shell: bash
        run: |
          set -euo pipefail
          set +e
          timeout --kill-after=2s 120s npm audit --package-lock-only --ignore-scripts --legacy-peer-deps --json > "$RUNNER_TEMP/imghost-vitest-$IMGHOST_PR/audit-full.json"
          full_status=$?
          timeout --kill-after=2s 120s npm audit --package-lock-only --omit=dev --ignore-scripts --legacy-peer-deps --json > "$RUNNER_TEMP/imghost-vitest-$IMGHOST_PR/audit-prod.json"
          prod_status=$?
          set -e
          printf '%s\n' "$full_status" > "$RUNNER_TEMP/imghost-vitest-$IMGHOST_PR/audit-full.exit"
          printf '%s\n' "$prod_status" > "$RUNNER_TEMP/imghost-vitest-$IMGHOST_PR/audit-prod.exit"
          python3 "$RUNNER_TEMP/imghost-vitest-controller.py" finished
      - name: Final host resource observation
        if: always()
        shell: bash
        run: |
          df -h /
          free -h
