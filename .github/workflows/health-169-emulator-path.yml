name: Android emulator selected path metadata only
on:
  push:
    branches: [prep/qualification/health-169-emulator-path-20261006]
    paths: [.github/workflows/health-169-emulator-path.yml]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  emulator-path-metadata:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Resource admission before SDK bootstrap
        shell: bash
        run: |
          set -euo pipefail
          df -h /
          free -h
          uptime
          python3 - <<'PY'
          import shutil
          from pathlib import Path
          memory = dict(line.split(':', 1) for line in Path('/proc/meminfo').read_text().splitlines())
          if shutil.disk_usage('/').free < 8*1024**3 or int(memory['MemAvailable'].split()[0])*1024 < 2*1024**3:
              raise RuntimeError('Cloud SDK control admission STOP')
          print('HEALTHMD_ADB_RESOURCE_ESTIMATE: <=500MiB additional bootstrap/control disk estimate, not allocation guarantee')
          PY
      - name: Materialize filesystem inventory (no SDK execution)
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, os
          from pathlib import Path
          data = base64.b64decode('', validate=True)
          if len(data) != 2857 or hashlib.sha256(data).hexdigest() != '8b21479a9e945f8308e1c8b741cb5e7c8f78bf7b450a8068958b28ceaec57b2c':
              raise RuntimeError('Inventory bytes STOP')
          p = Path(os.environ['RUNNER_TEMP']).resolve(strict=True)/'healthmd-sdk-paths.py'
          with p.open('xb') as f:
              f.write(data)
          if p.read_bytes() != data:
              raise RuntimeError('Inventory readback STOP')
          PY
          python3 -m py_compile "$RUNNER_TEMP/healthmd-sdk-paths.py"
      - name: Observe selected SDK paths before platform-tools setup
        run: python3 "$RUNNER_TEMP/healthmd-sdk-paths.py" before_platform_tools
      - name: Select installed Android platform-tools (no emulator)
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: platform-tools
      - name: Observe selected SDK paths after platform-tools setup
        shell: bash
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/healthmd-sdk-paths.py" after_platform_tools
      - name: Final resource observation (not cleanup or native acceptance)
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          df -h /
          free -h
          echo 'HEALTHMD_EMULATOR_PATH_BOUNDARY: selected filesystem metadata before/after platform-tools setup only; no emulator or ADB command/newprovider/installation/AVD/image/boot/server/device/app/AppleSDKresume/adoption. Fresh runner not prior runner or global absence proof; goal incomplete.'
