name: Synthetic named collector qualification (not Health tests)
on:
  push:
    branches: ['prep/qualification/named-collector-controls-20261005']
    paths: ['.github/workflows/named-collector-synthetic-qualification.yml']
permissions:
  contents: read
concurrency:
  group: named-collector-synthetic-${{ github.ref }}
  cancel-in-progress: false
jobs:
  synthetic-collector-controls:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Qualify finite synthetic input controls, not product execution
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, json, os, platform, re, sys
          import pyexpat
          def check(condition, message):
              if not condition:
                  raise RuntimeError('Qualification rejected: ' + message)
          env = os.environ
          sha = env['GITHUB_SHA']
          check(env['GITHUB_REPOSITORY'] == 'CodyBontecou/isome', 'repository')
          check(env['GITHUB_REF'] == 'refs/heads/prep/qualification/named-collector-controls-20261005', 'qualification branch')
          check(env['GITHUB_EVENT_NAME'] == 'push' and env['GITHUB_RUN_ATTEMPT'] == '1', 'first push attempt')
          check(re.fullmatch('[0-9a-f]{40}', sha) is not None and env['GITHUB_WORKFLOW_SHA'] == sha, 'workflow head')
          check(env['RUNNER_ENVIRONMENT'] == 'github-hosted' and platform.system() == 'Linux' and sys.version_info[:2] == (3, 12), 'public Linux Python runtime')
          source = base64.b64decode('', validate=True)
          controls = base64.b64decode('', validate=True)
          registry = base64.b64decode('', validate=True)
          pins = {'source':'2a3b5fa643a4c481966dbc64117912201d4fbf3854920350bc18eba4087b19ad', 'controls':'75367ac1a0942e7325b397d5ae4bcdb492ee242bbb92e4981249bcdd4d6af0e0', 'registry':'529080b733ff0b5f3441b87f5a07a813d686445ff4d184e2e9be0d136c5ec5ec'}
          for name,data in [('source',source),('controls',controls),('registry',registry)]:
              check(hashlib.sha256(data).hexdigest() == pins[name], 'literal source pin')
          print('NAMED_COLLECTOR_CONTROL_PROVENANCE ' + json.dumps({'purpose':'synthetic-collector-control', 'actual_product_execution_proven':False, 'head_sha':sha, 'workflow_sha':env['GITHUB_WORKFLOW_SHA'], 'run_id':env['GITHUB_RUN_ID'], 'attempt':env['GITHUB_RUN_ATTEMPT'], 'runner_environment':env['RUNNER_ENVIRONMENT'], 'runner_os':env['RUNNER_OS'], 'runner_arch':env['RUNNER_ARCH'], 'image_os':env.get('ImageOS'), 'image_version':env.get('ImageVersion'), 'python':sys.version, 'python_executable':sys.executable, 'platform':platform.platform(), 'expat':pyexpat.EXPAT_VERSION, 'optimize':sys.flags.optimize, 'source_pins':pins, 'source_bytes':len(source), 'controls_bytes':len(controls), 'registry_bytes':len(registry), 'limits':'No checkout, Gradle/JUnit/Android/Health test execution, SDK/dependency install, product/source/provenance/fresh XML authenticity or adoption. Controlled fake event/XML inputs only.'}, sort_keys=True), flush=True)
          namespace = {'__name__':'synthetic_collector_controls'}
          exec(compile(controls, '<pinned-cloud-control-source>', 'exec'), namespace)
          namespace['run_controls'](source, registry, pins['source'], sha, env['RUNNER_TEMP'])
          PY
