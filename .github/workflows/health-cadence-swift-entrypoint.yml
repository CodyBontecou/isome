name: Health cadence installed Swift entrypoint observations
on:
  push:
    branches: [prep/qualification/health-cadence-swift-entrypoint-20261005]
    paths: [.github/workflows/health-cadence-swift-entrypoint.yml]
permissions:
  contents: read
concurrency:
  group: health-cadence-swift-entrypoint-${{ github.ref }}
  cancel-in-progress: false
jobs:
  installed-tool-files-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GITHUB_WORKFLOW_SHA: ${{ github.workflow_sha }}
    steps:
      - name: Observe installed entrypoint files without invoking Swift
        shell: bash
        run: |
          set -euo pipefail
          df -h /
          python3 - <<'PYTHON'
          import base64,hashlib,os,pathlib
          raw=base64.b64decode("",validate=True)
          assert hashlib.sha256(raw).hexdigest()=="46a553b01f46283df0a97717e6d2de775b00c1b655365b54b272800db04464b5"
          parent=pathlib.Path(os.environ['RUNNER_TEMP'])
          assert parent.is_absolute() and parent.is_dir() and not parent.is_symlink()
          source=parent/'health-cadence-swift-entrypoint-observations.py'
          with source.open('xb') as stream: stream.write(raw)
          PYTHON
          python3 "$RUNNER_TEMP/health-cadence-swift-entrypoint-observations.py"
          echo 'SWIFT_ENTRYPOINT_LIMITS filesystem-only; no version command, compiler, SDK or test invocation; no timeout cause, executable authenticity, product-ref/PR or policy adoption'
