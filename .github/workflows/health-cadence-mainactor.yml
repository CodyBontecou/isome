name: Health cadence default MainActor XCTest qualification
on:
  push:
    branches: [prep/qualification/health-cadence-mainactor-20261006]
permissions:
  contents: read
concurrency:
  group: health-cadence-mainactor-${{ github.ref }}
  cancel-in-progress: false
jobs:
  default-mainactor:
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - name: Materialize complete pinned model and real XCTest file
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_SOURCE'
          import hashlib, json, os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'health-cadence-mainactor'
          assert not root.exists()
          root.mkdir(mode=0o700)
          files = {'Sources/HealthMd/ExportSchedule.swift': 'import Foundation\n\nenum ScheduledExportKind: String, Codable, Equatable, CaseIterable {\n    case completedDay = "completed-day"\n    case todayRefresh = "today-refresh"\n}\n\n/// Represents the configuration for scheduled health data exports\nstruct ExportSchedule: Codable, Equatable {\n    /// Whether scheduled exports are enabled\n    var isEnabled: Bool {\n        didSet {\n            guard isEnabled != oldValue else { return }\n            enabledAt = isEnabled ? Date() : nil\n        }\n    }\n\n    /// When the current enabled period began. Automatic runners use this to\n    /// avoid treating an occurrence that was already missed before the user\n    /// enabled scheduling as immediately due.\n    var enabledAt: Date?\n\n    /// The frequency of scheduled completed-day exports.\n    var frequency: ScheduleFrequency\n\n    /// Number of calendar units between custom scheduled exports.\n    var customInterval: Int {\n        didSet {\n            customInterval = Self.clampedCustomInterval(customInterval)\n        }\n    }\n\n    /// Calendar unit used by a custom scheduled export cadence.\n    var customUnit: ScheduleIntervalUnit\n\n    /// Calendar day that establishes the phase for a custom cadence.\n    /// Its time component is ignored in favor of `preferredHour` and\n    /// `preferredMinute`.\n    var customAnchorDate: Date\n\n    /// The preferred time of day for exports (hour in 24-hour format).\n    var preferredHour: Int\n\n    /// The preferred minute for exports (0-59).\n    var preferredMinute: Int\n\n    /// ISO weekday for weekly schedules (1 = Monday … 7 = Sunday).\n    /// Ignored for daily schedules. Defaults to Monday so legacy persisted\n    /// schedules without this field decode cleanly.\n    var weekday: Int\n\n    /// Destination used by scheduled exports. Legacy persisted schedules decode\n    /// as local iPhone-folder exports to preserve existing behavior.\n    var target: ExportTargetSelection\n\n    /// Number of past days to include in each completed-day scheduled export.\n    /// For example, 1 exports yesterday only; 2 exports yesterday + the day before.\n    var lookbackDays: Int {\n        didSet {\n            lookbackDays = Self.clampedLookbackDays(lookbackDays)\n        }\n    }\n\n    /// Whether to also refresh today\'s file during the current day.\n    var todayRefreshEnabled: Bool\n\n    /// Best-effort same-day refresh interval in hours. iOS may delay execution.\n    var todayRefreshIntervalHours: Int {\n        didSet {\n            todayRefreshIntervalHours = Self.clampedTodayRefreshIntervalHours(todayRefreshIntervalHours)\n        }\n    }\n\n    /// The date of the last successful completed-day export.\n    var lastExportDate: Date?\n\n    /// The scheduled fire date of the last successful Today Refresh export.\n    var lastTodayRefreshDate: Date?\n\n    static let minimumLookbackDays = 1\n    static let maximumLookbackDays = 30\n    static let minimumCustomInterval = 1\n    static let maximumCustomInterval = 365\n    static let todayRefreshIntervalOptions = [3, 6, 12]\n    static let defaultTodayRefreshIntervalHours = 3\n\n    static func defaultLookbackDays(\n        for frequency: ScheduleFrequency,\n        customInterval: Int = 1,\n        customUnit: ScheduleIntervalUnit = .day\n    ) -> Int {\n        switch frequency {\n        case .daily:\n            return 1\n        case .weekly:\n            return 7\n        case .custom:\n            let interval = clampedCustomInterval(customInterval)\n            return clampedLookbackDays(interval * customUnit.nominalDayCount)\n        }\n    }\n\n    static func clampedLookbackDays(_ days: Int) -> Int {\n        min(max(Self.minimumLookbackDays, days), Self.maximumLookbackDays)\n    }\n\n    static func clampedCustomInterval(_ interval: Int) -> Int {\n        min(max(Self.minimumCustomInterval, interval), Self.maximumCustomInterval)\n    }\n\n    static func clampedTodayRefreshIntervalHours(_ hours: Int) -> Int {\n        if Self.todayRefreshIntervalOptions.contains(hours) { return hours }\n        guard let minimumHours = Self.todayRefreshIntervalOptions.min(),\n              let maximumHours = Self.todayRefreshIntervalOptions.max() else {\n            return Self.defaultTodayRefreshIntervalHours\n        }\n        // Bound unsupported inputs before subtraction so decoded Int.min\n        // cannot overflow nearest-option distance calculation.\n        let boundedHours = min(max(hours, minimumHours), maximumHours)\n        return Self.todayRefreshIntervalOptions.min { lhs, rhs in\n            abs(lhs - boundedHours) < abs(rhs - boundedHours)\n        } ?? Self.defaultTodayRefreshIntervalHours\n    }\n\n    init(\n        isEnabled: Bool = false,\n        frequency: ScheduleFrequency = .daily,\n        customInterval: Int = 1,\n        customUnit: ScheduleIntervalUnit = .day,\n        customAnchorDate: Date = Date(),\n        preferredHour: Int = 8,\n        preferredMinute: Int = 0,\n        weekday: Int = 1,\n        target: ExportTargetSelection = .localIPhoneFolder,\n        lookbackDays: Int? = nil,\n        todayRefreshEnabled: Bool = false,\n        todayRefreshIntervalHours: Int = Self.defaultTodayRefreshIntervalHours,\n        lastExportDate: Date? = nil,\n        lastTodayRefreshDate: Date? = nil,\n        enabledAt: Date? = nil\n    ) {\n        self.isEnabled = isEnabled\n        self.enabledAt = enabledAt\n        self.frequency = frequency\n        self.customInterval = Self.clampedCustomInterval(customInterval)\n        self.customUnit = customUnit\n        self.customAnchorDate = customAnchorDate\n        self.preferredHour = preferredHour\n        self.preferredMinute = preferredMinute\n        self.weekday = weekday\n        self.target = target\n        self.lookbackDays = Self.clampedLookbackDays(\n            lookbackDays ?? Self.defaultLookbackDays(\n                for: frequency,\n                customInterval: customInterval,\n                customUnit: customUnit\n            )\n        )\n        self.todayRefreshEnabled = todayRefreshEnabled\n        self.todayRefreshIntervalHours = Self.clampedTodayRefreshIntervalHours(todayRefreshIntervalHours)\n        self.lastExportDate = lastExportDate\n        self.lastTodayRefreshDate = lastTodayRefreshDate\n    }\n\n    private enum CodingKeys: String, CodingKey {\n        case isEnabled\n        case enabledAt\n        case frequency\n        case customInterval\n        case customUnit\n        case customAnchorDate\n        case preferredHour\n        case preferredMinute\n        case weekday\n        case target\n        case lookbackDays\n        case todayRefreshEnabled\n        case todayRefreshIntervalHours\n        case lastExportDate\n        case lastTodayRefreshDate\n    }\n\n    init(from decoder: Decoder) throws {\n        let c = try decoder.container(keyedBy: CodingKeys.self)\n        self.isEnabled = try c.decode(Bool.self, forKey: .isEnabled)\n        self.enabledAt = try c.decodeIfPresent(Date.self, forKey: .enabledAt)\n        self.frequency = try c.decode(ScheduleFrequency.self, forKey: .frequency)\n        let decodedCustomInterval = try c.decodeIfPresent(Int.self, forKey: .customInterval) ?? 1\n        self.customInterval = Self.clampedCustomInterval(decodedCustomInterval)\n        self.customUnit = try c.decodeIfPresent(ScheduleIntervalUnit.self, forKey: .customUnit) ?? .day\n        self.customAnchorDate = try c.decodeIfPresent(Date.self, forKey: .customAnchorDate)\n            ?? self.enabledAt\n            ?? Date()\n        self.preferredHour = try c.decode(Int.self, forKey: .preferredHour)\n        self.preferredMinute = try c.decode(Int.self, forKey: .preferredMinute)\n        self.weekday = try c.decodeIfPresent(Int.self, forKey: .weekday) ?? 1\n        self.target = try c.decodeIfPresent(ExportTargetSelection.self, forKey: .target) ?? .localIPhoneFolder\n        let decodedLookbackDays = try c.decodeIfPresent(Int.self, forKey: .lookbackDays)\n        self.lookbackDays = Self.clampedLookbackDays(\n            decodedLookbackDays ?? Self.defaultLookbackDays(\n                for: frequency,\n                customInterval: customInterval,\n                customUnit: customUnit\n            )\n        )\n        self.todayRefreshEnabled = try c.decodeIfPresent(Bool.self, forKey: .todayRefreshEnabled) ?? false\n        let decodedTodayRefreshIntervalHours = try c.decodeIfPresent(Int.self, forKey: .todayRefreshIntervalHours)\n        self.todayRefreshIntervalHours = Self.clampedTodayRefreshIntervalHours(decodedTodayRefreshIntervalHours ?? Self.defaultTodayRefreshIntervalHours)\n        self.lastExportDate = try c.decodeIfPresent(Date.self, forKey: .lastExportDate)\n        self.lastTodayRefreshDate = try c.decodeIfPresent(Date.self, forKey: .lastTodayRefreshDate)\n    }\n}\n\n/// Calendar units available for a custom scheduled export cadence.\nenum ScheduleIntervalUnit: String, Codable, CaseIterable {\n    case day\n    case week\n    case month\n\n    var nominalDayCount: Int {\n        switch self {\n        case .day: return 1\n        case .week: return 7\n        case .month: return 30\n        }\n    }\n\n    func label(for interval: Int) -> String {\n        let singular: String\n        switch self {\n        case .day: singular = "day"\n        case .week: singular = "week"\n        case .month: singular = "month"\n        }\n        return interval == 1 ? singular : "\\(singular)s"\n    }\n}\n\n/// Frequency options for scheduled exports.\nenum ScheduleFrequency: String, Codable, CaseIterable {\n    case daily = "Daily"\n    case weekly = "Weekly"\n    case custom = "Custom"\n\n    var description: String {\n        switch self {\n        case .daily: return String(localized: "Daily", comment: "Scheduled export frequency")\n        case .weekly: return String(localized: "Weekly", comment: "Scheduled export frequency")\n        case .custom: return String(localized: "Custom", comment: "Scheduled export frequency")\n        }\n    }\n\n    /// Returns the fixed interval in seconds for built-in frequencies.\n    /// Custom cadences use calendar-aware values stored on `ExportSchedule`,\n    /// so they do not have a single fixed-duration interval.\n    var interval: TimeInterval {\n        switch self {\n        case .daily:\n            return 24 * 60 * 60 // 24 hours\n        case .weekly:\n            return 7 * 24 * 60 * 60 // 7 days\n        case .custom:\n            return 0\n        }\n    }\n}\n\n// MARK: - UserDefaults Extension\nextension ExportSchedule {\n    private static let scheduleKey = "exportSchedule"\n\n    /// Saves the schedule to UserDefaults\n    func save() {\n        if let encoded = try? JSONEncoder().encode(self) {\n            UserDefaults.standard.set(encoded, forKey: Self.scheduleKey)\n        }\n    }\n\n    /// Loads the schedule from UserDefaults\n    static func load() -> ExportSchedule {\n        guard let data = UserDefaults.standard.data(forKey: scheduleKey),\n              let decoded = try? JSONDecoder().decode(ExportSchedule.self, from: data) else {\n            return ExportSchedule()\n        }\n        return decoded\n    }\n\n    /// Updates the logical completed-day occurrence that most recently\n    /// succeeded and saves. Automatic runners pass the scheduled fire date so\n    /// a delayed run does not make later catch-up logic skip unexported days.\n    mutating func updateLastExport(at occurrenceDate: Date = Date()) {\n        self.lastExportDate = occurrenceDate\n        self.save()\n    }\n}\n', 'Sources/HealthMd/ExportTargetSelection.swift': 'import Foundation\n\n/// User-selected destination for manual exports initiated from iOS.\nenum ExportTargetSelection: String, CaseIterable, Codable, Equatable, Identifiable {\n    case localIPhoneFolder\n    case connectedMac\n    case apiEndpoint\n\n    static let storageKey = "exportTargetSelection"\n\n    var id: String { rawValue }\n\n    var title: String {\n        switch self {\n        case .localIPhoneFolder:\n            return "Local iPhone Folder"\n        case .connectedMac:\n            return "Connected Mac"\n        case .apiEndpoint:\n            return "API Endpoint"\n        }\n    }\n\n    var requiresNetworkForScheduledExport: Bool {\n        switch self {\n        case .localIPhoneFolder:\n            return false\n        case .connectedMac, .apiEndpoint:\n            return true\n        }\n    }\n}\n\n/// Pure export gating helper so UI and tests share the same target-specific rules.\nstruct ExportTargetReadiness {\n    static func canExport(\n        isHealthKitAuthorized: Bool,\n        hasSelectedFormat: Bool,\n        dailyNotesOnlyModeEnabled: Bool = false,\n        target: ExportTargetSelection,\n        hasLocalFolder: Bool,\n        canExportToConnectedMac: Bool,\n        apiEndpointConfigured: Bool = false\n    ) -> Bool {\n        guard isHealthKitAuthorized else { return false }\n\n        switch target {\n        case .localIPhoneFolder:\n            return (hasSelectedFormat || dailyNotesOnlyModeEnabled) && hasLocalFolder\n        case .connectedMac:\n            return (hasSelectedFormat || dailyNotesOnlyModeEnabled) && canExportToConnectedMac\n        case .apiEndpoint:\n            // API destinations cannot resolve or mutate a filesystem daily note.\n            return hasSelectedFormat && !dailyNotesOnlyModeEnabled && apiEndpointConfigured\n        }\n    }\n}\n', 'Tests/HealthMdModelTests/ExportScheduleTests.swift': 'import XCTest\n@testable import HealthMd\n\nfinal class ScheduledExportTargetScheduleTests: XCTestCase {\n    func testExtremeRefreshIntervalsClampDuringInitializationWithoutChangingScheduleState() {\n        for (hours, expectedHours) in [(Int.min, 3), (Int.min + 1, 3), (Int.max - 1, 12), (Int.max, 12)] {\n            for frequency in [ScheduleFrequency.daily, .weekly] {\n                let actual = refreshClampSchedule(hours: hours, frequency: frequency)\n                let expected = refreshClampSchedule(hours: expectedHours, frequency: frequency)\n                XCTAssertEqual(actual, expected, "Unsupported interval \\(hours) must not change other scheduling fields")\n                XCTAssertEqual(actual.todayRefreshIntervalHours, expectedHours)\n            }\n        }\n    }\n\n    func testExtremeRefreshIntervalsClampDuringMutationWithoutMovingSuccessFrontiers() {\n        let original = refreshClampSchedule(hours: 6, frequency: .weekly)\n        for (hours, expectedHours) in [(Int.min, 3), (Int.min + 1, 3), (Int.max - 1, 12), (Int.max, 12)] {\n            var actual = original\n            actual.todayRefreshIntervalHours = hours\n            let expected = refreshClampSchedule(hours: expectedHours, frequency: .weekly)\n            XCTAssertEqual(actual, expected)\n            XCTAssertEqual(actual.lastExportDate, original.lastExportDate)\n            XCTAssertEqual(actual.lastTodayRefreshDate, original.lastTodayRefreshDate)\n            XCTAssertEqual(actual.enabledAt, original.enabledAt)\n        }\n    }\n\n    func testExtremeRefreshIntervalsDecodeAndReencodeOnlySupportedLegacyHours() throws {\n        XCTAssertEqual(ExportSchedule.todayRefreshIntervalOptions, [3, 6, 12])\n        XCTAssertEqual(ExportSchedule.defaultTodayRefreshIntervalHours, 3)\n        let original = refreshClampSchedule(hours: 6, frequency: .weekly)\n        let originalData = try JSONEncoder().encode(original)\n        let originalObject = try XCTUnwrap(JSONSerialization.jsonObject(with: originalData) as? [String: Any])\n        for (hours, expectedHours) in [(Int.min, 3), (Int.min + 1, 3), (Int.max - 1, 12), (Int.max, 12)] {\n            var payload = originalObject\n            payload["todayRefreshIntervalHours"] = hours\n            let data = try JSONSerialization.data(withJSONObject: payload, options: [.sortedKeys])\n            let decoded = try JSONDecoder().decode(ExportSchedule.self, from: data)\n            XCTAssertEqual(decoded, refreshClampSchedule(hours: expectedHours, frequency: .weekly))\n            let reencoded = try XCTUnwrap(JSONSerialization.jsonObject(with: JSONEncoder().encode(decoded)) as? [String: Any])\n            XCTAssertEqual(reencoded["todayRefreshIntervalHours"] as? Int, expectedHours)\n            XCTAssertEqual(Set(reencoded.keys), Set(originalObject.keys))\n            XCTAssertNil(reencoded["todayRefreshIntervalMinutes"])\n        }\n    }\n\n    private func refreshClampSchedule(hours: Int, frequency: ScheduleFrequency) -> ExportSchedule {\n        ExportSchedule(\n            isEnabled: true, frequency: frequency, customInterval: 2,\n            customUnit: .week, customAnchorDate: Date(timeIntervalSince1970: 1_699_900_000),\n            preferredHour: 8, preferredMinute: 15, weekday: 4,\n            target: .apiEndpoint, lookbackDays: 7,\n            todayRefreshEnabled: true, todayRefreshIntervalHours: hours,\n            lastExportDate: Date(timeIntervalSince1970: 1_700_100_000),\n            lastTodayRefreshDate: Date(timeIntervalSince1970: 1_700_103_600),\n            enabledAt: Date(timeIntervalSince1970: 1_700_000_000)\n        )\n    }\n\n    func testDefaultScheduleTargetsLocalIPhoneFolder() {\n        XCTAssertEqual(ExportSchedule().target, .localIPhoneFolder)\n    }\n\n    func testDecodesLegacyScheduleWithoutTargetAsLocalIPhoneFolder() throws {\n        let payload: [String: Any] = [\n            "isEnabled": true,\n            "frequency": ScheduleFrequency.daily.rawValue,\n            "preferredHour": 8,\n            "preferredMinute": 0,\n            "weekday": 1,\n            "lookbackDays": 1\n        ]\n        let data = try JSONSerialization.data(withJSONObject: payload, options: [.sortedKeys])\n\n        let decoded = try JSONDecoder().decode(ExportSchedule.self, from: data)\n\n        XCTAssertEqual(decoded.target, .localIPhoneFolder)\n    }\n\n    // Issue #9 investigation: these characterize the legacy hour grammar, not\n    // acceptance of new minute intervals. Never use zero as a half-hour sentinel.\n    func testLegacyHourReaderClampsZeroAndOneRatherThanRepresentingRequestedCadence() throws {\n        for hours in [0, 1] {\n            let payload: [String: Any] = [\n                "isEnabled": true,\n                "frequency": ScheduleFrequency.daily.rawValue,\n                "preferredHour": 8,\n                "preferredMinute": 0,\n                "todayRefreshEnabled": true,\n                "todayRefreshIntervalHours": hours\n            ]\n            let data = try JSONSerialization.data(withJSONObject: payload)\n            let decoded = try JSONDecoder().decode(ExportSchedule.self, from: data)\n            XCTAssertEqual(decoded.todayRefreshIntervalHours, 3)\n            XCTAssertTrue(decoded.todayRefreshEnabled)\n        }\n    }\n\n    func testLegacyReaderIgnoresUnrecognizedMinuteIntentAndDropsItOnReencode() throws {\n        // A hypothetical additive field alone cannot safely change old-reader semantics.\n        let payload: [String: Any] = [\n            "isEnabled": true,\n            "frequency": ScheduleFrequency.daily.rawValue,\n            "preferredHour": 8,\n            "preferredMinute": 0,\n            "todayRefreshEnabled": true,\n            "todayRefreshIntervalHours": 3,\n            "todayRefreshIntervalMinutes": 30\n        ]\n        let decoded = try JSONDecoder().decode(ExportSchedule.self, from:\n            JSONSerialization.data(withJSONObject: payload))\n        XCTAssertEqual(decoded.todayRefreshIntervalHours, 3)\n        let reencoded = try XCTUnwrap(JSONSerialization.jsonObject(with:\n            JSONEncoder().encode(decoded)) as? [String: Any])\n        XCTAssertNil(reencoded["todayRefreshIntervalMinutes"])\n    }\n\n    func testLegacyHourReaderRejectsFractionalHours() throws {\n        let payload: [String: Any] = [\n            "isEnabled": true,\n            "frequency": ScheduleFrequency.daily.rawValue,\n            "preferredHour": 8,\n            "preferredMinute": 0,\n            "todayRefreshEnabled": true,\n            "todayRefreshIntervalHours": 0.5\n        ]\n        let data = try JSONSerialization.data(withJSONObject: payload)\n        XCTAssertThrowsError(try JSONDecoder().decode(ExportSchedule.self, from: data)) { error in\n            XCTAssertTrue(error is DecodingError)\n        }\n    }\n\n    func testLegacySupportedRefreshIntervalsRoundTripWithoutChangingCompletedScheduleOrProgress() throws {\n        let enabled = Date(timeIntervalSince1970: 1_700_000_000)\n        let completed = enabled.addingTimeInterval(86_400)\n        let refreshed = completed.addingTimeInterval(3_600)\n        for frequency in [ScheduleFrequency.daily, .weekly] {\n            for hours in [3, 6, 12] {\n                let schedule = ExportSchedule(\n                    isEnabled: true, frequency: frequency,\n                    preferredHour: 8, preferredMinute: 15, weekday: 4,\n                    target: .apiEndpoint, lookbackDays: 7,\n                    todayRefreshEnabled: true, todayRefreshIntervalHours: hours,\n                    lastExportDate: completed, lastTodayRefreshDate: refreshed,\n                    enabledAt: enabled\n                )\n                let decoded = try JSONDecoder().decode(ExportSchedule.self, from: JSONEncoder().encode(schedule))\n                XCTAssertEqual(decoded, schedule)\n            }\n        }\n    }\n\n    func testEncodesAndDecodesScheduledAPITarget() throws {\n        let schedule = ExportSchedule(\n            isEnabled: true,\n            frequency: .daily,\n            preferredHour: 7,\n            preferredMinute: 30,\n            target: .apiEndpoint,\n            lookbackDays: 2\n        )\n\n        let decoded = try JSONDecoder().decode(ExportSchedule.self, from: JSONEncoder().encode(schedule))\n\n        XCTAssertEqual(decoded.target, .apiEndpoint)\n        XCTAssertEqual(decoded.lookbackDays, 2)\n    }\n}\n', 'Package.swift': '// swift-tools-version: 6.2\nimport PackageDescription\n// Match only the reviewed default actor isolation/language settings.\n// ApproachableConcurrency and MemberImportVisibility remain separate gaps.\nlet isolationSettings: [SwiftSetting] = [.defaultIsolation(MainActor.self)]\nlet package = Package(\n    name: "HealthMdModelQualification",\n    platforms: [.macOS(.v14)],\n    products: [.library(name: "HealthMd", targets: ["HealthMd"])],\n    targets: [\n        .target(name: "HealthMd", swiftSettings: isolationSettings),\n        .testTarget(name: "HealthMdModelTests", dependencies: ["HealthMd"],\n                    swiftSettings: isolationSettings)\n    ],\n    swiftLanguageModes: [.v5]\n)\n', 'controller.py': '"""Cloud-only whole-model XCTest qualification, not app/device acceptance."""\nimport hashlib\nimport json\nimport os\nfrom pathlib import Path\nimport platform\nimport re\nimport shlex\nimport shutil\nimport signal\nimport subprocess\nimport sys\nimport time\n\n\ndef receipt(kind, **payload):\n    print(kind + \' \' + json.dumps(payload, sort_keys=True), flush=True)\n\n\ndef require(ok, message):\n    if not ok:\n        raise RuntimeError(message)\n\n\ndef command(argv, seconds, cwd):\n    start = time.monotonic()\n    process = subprocess.Popen(argv, cwd=cwd, stdout=subprocess.PIPE,\n                               stderr=subprocess.STDOUT, start_new_session=True)\n    output = None\n    primary = None\n    cleanup_errors = []\n    try:\n        receipt(\'MODEL_COMMAND_STARTED\', argv=argv, root_pid=process.pid,\n                timeout_seconds=seconds, owned_group=process.pid)\n        output, _ = process.communicate(timeout=seconds)\n        require(len(output) <= 524288, \'Post-return output cap exceeded\')\n        text = output.decode(\'utf-8\', errors=\'strict\')\n        print(text, end=\'\' if text.endswith(\'\\n\') else \'\\n\', flush=True)\n        require(process.returncode == 0, \'Nonzero product command exit\')\n        return text\n    except BaseException as error:\n        primary = type(error).__name__\n        raise\n    finally:\n        root_poll = process.poll()\n        killed = False\n        if root_poll is None:\n            try:\n                # This private process group was created for exactly this command.\n                # Signal before reaping its still-live root; never reuse a reaped PID.\n                os.killpg(process.pid, signal.SIGKILL)\n                killed = True\n            except ProcessLookupError:\n                pass\n            except BaseException as error:\n                cleanup_errors.append(type(error).__name__)\n                try:\n                    process.kill()\n                except BaseException as fallback:\n                    cleanup_errors.append(type(fallback).__name__)\n        try:\n            process.wait(timeout=2)\n        except BaseException as error:\n            cleanup_errors.append(type(error).__name__)\n        if process.stdout is not None:\n            process.stdout.close()\n        receipt(\'MODEL_COMMAND_FINISHED\', argv=argv, root_pid=process.pid,\n                returncode=process.returncode, elapsed_seconds=time.monotonic() - start,\n                primary_exception=primary, root_poll_before_cleanup=root_poll,\n                owned_group_killed=killed, owned_pipe_closed=process.stdout.closed,\n                cleanup_errors=cleanup_errors,\n                combined_bytes=None if output is None else len(output),\n                combined_sha256=None if output is None else hashlib.sha256(output).hexdigest())\n        if cleanup_errors and primary is None:\n            raise RuntimeError(\'Owned-root cleanup unverified\')\n\n\ndef verify(root, manifest):\n    for row in manifest[\'files\']:\n        path = root / row[\'destination\']\n        require(path.is_file() and not path.is_symlink(), \'Expected regular source file\')\n        data = path.read_bytes()\n        require(len(data) == row[\'bytes\'] and hashlib.sha256(data).hexdigest() == row[\'sha256\'],\n                \'Whole source pin mismatch: \' + row[\'destination\'])\n        receipt(\'MODEL_SOURCE_OBSERVED\', **row)\n\n\ndef main():\n    require(os.environ.get(\'GITHUB_ACTIONS\') == \'true\' and sys.platform == \'darwin\',\n            \'Hosted macOS required; never execute locally\')\n    require(os.environ[\'GITHUB_SHA\'] == os.environ[\'GITHUB_WORKFLOW_SHA\'], \'Workflow/head mismatch\')\n    require(sys.flags.optimize == 0, \'Optimized controller not admitted\')\n    root = Path(os.environ[\'MODEL_ROOT\'])\n    require(root.is_absolute() and root.is_dir() and not root.is_symlink(), \'Private root missing\')\n    require(shutil.disk_usage(root).free >= 8 * 1024**3, \'Cloud resource admission failed\')\n    manifest = json.loads((root / \'manifest.json\').read_text())\n    verify(root, manifest)\n    receipt(\'MODEL_RUNTIME\', platform=platform.platform(), python=sys.version,\n            head=os.environ[\'GITHUB_SHA\'], tested_health_head=manifest[\'health_head\'],\n            swift_language_mode=\'5\', default_actor_isolation=\'MainActor\',\n            native_approachable_concurrency_equivalence=False,\n            scope=\'two whole files / ten real XCTest methods with default actor flag; not native app or iOS\')\n    swift = shutil.which(\'swift\')\n    require(swift is not None and os.path.isabs(swift), \'Installed Swift unavailable\')\n    command([swift, \'--version\'], 12, root)\n    build_text = command([swift, \'build\', \'--build-tests\', \'--jobs\', \'2\', \'--verbose\'], 180, root)\n    # Inspect SwiftPM\'s ordinary verbose compiler command lines, not YAML echoes.\n    # These are configured arguments, not loaded-process/module attestation.\n    modules = set()\n    for line in build_text.splitlines():\n        if not line.startswith(\'/\') or \' -module-name \' not in line:\n            continue\n        argv = shlex.split(line)\n        if Path(argv[0]).name not in (\'swiftc\', \'swift-frontend\'):\n            continue\n        module = argv[argv.index(\'-module-name\') + 1]\n        if module not in (\'HealthMd\', \'HealthMdModelTests\'):\n            continue\n        require(\'-default-isolation\' in argv and\n                argv[argv.index(\'-default-isolation\') + 1] == \'MainActor\',\n                \'Expected default MainActor compiler argument missing\')\n        require(\'-swift-version\' in argv and\n                argv[argv.index(\'-swift-version\') + 1] == \'5\',\n                \'Expected Swift language mode 5 missing\')\n        modules.add(module)\n        receipt(\'MODEL_DEFAULT_ISOLATION_COMPILER_COMMAND\', module=module,\n                compiler=argv[0], default_isolation=\'MainActor\', swift_language_mode=\'5\',\n                configured_command_not_loaded_process=True,\n                argv_sha256=hashlib.sha256(json.dumps(argv).encode()).hexdigest())\n    require(modules == {\'HealthMd\', \'HealthMdModelTests\'},\n            \'Both production and test module compiler arguments required\')\n    text = command([swift, \'test\', \'--skip-build\', \'--jobs\', \'2\'], 60, root)\n    expected = manifest[\'tests\']\n    records = []\n    for line in text.splitlines():\n        match = re.fullmatch(r"Test Case \'-\\[HealthMdModelTests\\.ScheduledExportTargetScheduleTests (test[A-Za-z0-9_]+)\\]\' (started\\.|passed \\(([0-9.]+) seconds\\)\\.)", line)\n        if match:\n            records.append((match.group(1), \'START\' if match.group(2) == \'started.\' else \'PASS\', match.group(3)))\n    require(len(records) == 2 * len(expected), \'Missing/extra ordinary XCTest records\')\n    require(len(set(expected)) == len(expected) == 10, \'Exact ten-method registration required\')\n    require(\'failed\' not in text.lower() and \'skipped\' not in text.lower(), \'Failure/skip present\')\n    for i in range(0, len(records), 2):\n        start, end = records[i:i+2]\n        require(start[0] == end[0] and start[1] == \'START\' and end[1] == \'PASS\', \'Interrupted/reordered case\')\n        require(start[0] in expected and float(end[2]) <= 60, \'Unknown or late case\')\n    require(sorted(row[0] for row in records[::2]) == sorted(expected), \'Registration does not match execution\')\n    verify(root, manifest)\n    for start, end in zip(records[::2], records[1::2]):\n        receipt(\'MODEL_CASE_QUALIFIED\', name=start[0], outcome=end[1], seconds=float(end[2]))\n    receipt(\'MODEL_QUALIFICATION_FINISHED\', case_count=10, app_acceptance=False,\n            ios_acceptance=False, android_acceptance=False, minute_cadence=False)\n\n\nif __name__ == \'__main__\':\n    main()\n', 'manifest.json': '{\n  "health_head": "5ebe91b6c5ec1b06bcb746fb95cd8015e75a4cd3",\n  "files": [\n    {\n      "destination": "Sources/HealthMd/ExportSchedule.swift",\n      "bytes": 11287,\n      "sha256": "efb6705ee2a79f427b8fd8d7231493de5f5a378089c1ff1fee02b7c4b91c82ef"\n    },\n    {\n      "destination": "Sources/HealthMd/ExportTargetSelection.swift",\n      "bytes": 1779,\n      "sha256": "973c5381df948e75f8254e7b2453bceff0ac3db96d210565ef884e77ee59dfaf"\n    },\n    {\n      "destination": "Tests/HealthMdModelTests/ExportScheduleTests.swift",\n      "bytes": 8259,\n      "sha256": "2f067498d4049d9faeda8d875cbeb20920a5a827ebdc47fafe22a033592dd4f3"\n    },\n    {\n      "destination": "Package.swift",\n      "bytes": 690,\n      "sha256": "acd80f88d98aae815e1ad8d9f8aab016fba3217325a5568c8507d1d0d8647887"\n    },\n    {\n      "destination": "controller.py",\n      "bytes": 7571,\n      "sha256": "d5a7df2174c0dae1e2831a1bac06f4d0c06824d3f02bec859295d30e4138e621"\n    }\n  ],\n  "tests": [\n    "testExtremeRefreshIntervalsClampDuringInitializationWithoutChangingScheduleState",\n    "testExtremeRefreshIntervalsClampDuringMutationWithoutMovingSuccessFrontiers",\n    "testExtremeRefreshIntervalsDecodeAndReencodeOnlySupportedLegacyHours",\n    "testDefaultScheduleTargetsLocalIPhoneFolder",\n    "test