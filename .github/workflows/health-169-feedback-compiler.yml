name: Health169 paired full-project feedback compiler qualification
on:
  push:
    branches: [prep/qualification/health-169-feedback-compiler-20261006]
permissions:
  contents: read
jobs:
  paired-compiler:
    runs-on: macos-26
    timeout-minutes: 115
    steps:
      - name: Cloud resource admission before source checkout
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYTHON'
          import os,sys,shutil,subprocess,re,json
          assert os.environ['GITHUB_SHA']==os.environ['GITHUB_WORKFLOW_SHA']
          assert os.environ['RUNNER_ENVIRONMENT']=='github-hosted' and os.environ['RUNNER_OS']=='macOS'
          free=shutil.disk_usage('/').free
          assert free>=20*1024**3
          probe=subprocess.run(['/usr/bin/vm_stat'],capture_output=True,timeout=12,check=True)
          assert len(probe.stdout)<=16384
          text=probe.stdout.decode('utf8')
          page=int(re.search(r'page size of (\d+) bytes',text).group(1))
          counts={name:int(re.search(r'^'+re.escape(name)+r':\s+(\d+)\.',text,re.M).group(1)) for name in ['Pages free','Pages inactive','Pages speculative']}
          reclaimable_estimate=page*sum(counts.values())
          assert reclaimable_estimate>=4*1024**3
          print('HEALTHMD_FEEDBACK_COMPILER_RESOURCE_ADMISSION '+json.dumps({'disk_free_bytes':free,'python_version':sys.version,'vm_stat_counts':counts,'page_size':page,'free_inactive_speculative_bytes':reclaimable_estimate,'additional_writes_peak_estimate_bytes':12*1024**3,'limits':'vm_stat free+inactive+speculative estimate, not Linux MemAvailable or universal immediately allocatable memory; specific compiler/normal Rust producer admission only; no SDK probes or native tests.'},sort_keys=True),flush=True)
          PYTHON
      - name: Checkout immutable Health source (no product branch edits)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: CodyBontecou/health-md
          ref: 1dfd7f49dd5e7b7d39228b50a6763cb8a8342ff7
          path: health-source
          fetch-depth: 1
          lfs: false
          submodules: false
          persist-credentials: false
      - name: Materialize exact pinned gate and cloud syntax checks
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYTHON'
          from pathlib import Path
          import os,base64,hashlib,json
          root=Path(os.environ['RUNNER_TEMP'])/'health169-feedback-compiler-material'
          assert not root.exists()
          root.mkdir(mode=0o700)
          rows=[{'name': 'runner.py', 'bytes': 7443, 'sha256': '5d9d1b4875bca9685c490445c59367d0f5917c7676cd6cd60d2939a48c5f19af', 'base64': ''}, {'name': 'controller.py', 'bytes': 11987, 'sha256': '1f10d540548c902c38a7fb429c57f3e0c12a9c0555c692d39552a23a3b43ec1d', 'base64': ''}, {'name': 'sdk-proxy.py', 'bytes': 4380, 'sha256': 'abab3fab2a9603d8bfda1ad725c774b71db486d97dccec7e7fe15f85383c248f', 'base64': ''}, {'name': 'pins.json', 'bytes': 2487, 'sha256': 'cf2cc9ca3ee94995274fa31e91e21f8a1ca8c9679fb8fc3ffc3cdc6cd7bc3b0c', 'base64': ''}, {'name': 'edits.json', 'bytes': 1204, 'sha256': '107542c39a736cb85c80f4ab2a642f83d46638acdd8a604bc6fb1a3c8aac9f81', 'base64': ''}]
          for row in rows:
              data=base64.b64decode(row['base64'],validate=True)
              assert len(data)==row['bytes'] and hashlib.sha256(data).hexdigest()==row['sha256']
              (root/row['name']).write_bytes(data)
              print('HEALTHMD_FEEDBACK_COMPILER_GATE_SOURCE '+json.dumps({k:v for k,v in row.items() if k!='base64'},sort_keys=True),flush=True)
          PYTHON
          python3 -m py_compile "$RUNNER_TEMP/health169-feedback-compiler-material/runner.py" "$RUNNER_TEMP/health169-feedback-compiler-material/controller.py" "$RUNNER_TEMP/health169-feedback-compiler-material/sdk-proxy.py"
      - name: prepare (compile only; no app or test execution)
        shell: bash
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/health169-feedback-compiler-material/controller.py" prepare
      - name: baseline-mac (compile only; no app or test execution)
        shell: bash
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/health169-feedback-compiler-material/controller.py" baseline-mac
      - name: baseline-ios (compile only; no app or test execution)
        shell: bash
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/health169-feedback-compiler-material/controller.py" baseline-ios
      - name: apply (compile only; no app or test execution)
        shell: bash
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/health169-feedback-compiler-material/controller.py" apply
      - name: candidate-mac (compile only; no app or test execution)
        shell: bash
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/health169-feedback-compiler-material/controller.py" candidate-mac
      - name: candidate-ios (compile only; no app or test execution)
        shell: bash
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/health169-feedback-compiler-material/controller.py" candidate-ios
      - name: Final resource observation (not SDK global cleanup)
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          df -h /
          /usr/bin/vm_stat
