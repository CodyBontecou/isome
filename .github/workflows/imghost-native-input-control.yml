name: imghost native reversible input companion

on:
  push:
    branches: [prep/qualification/imghost-7-native-input-control-20261005]
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: imghost-native-input-companion-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native:
    runs-on: macos-15
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        platform: [iOS, macOS]
    env:
      PLATFORM: ${{ matrix.platform }}
      GITHUB_WORKFLOW_SHA: ${{ github.workflow_sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: CodyBontecou/imghost
          ref: 553d78a79cc26637d870e0bbf0c052cd1c006f87
          fetch-depth: 1
          persist-credentials: false
          lfs: false
          submodules: false
      - name: Existing hosted tools and resources, no SDK install or replacement
        shell: bash
        run: |
          set -euo pipefail
          df -h /
          vm_stat
          uptime
          python3 - <<'PYSDK'
          import base64, hashlib, os, pathlib
          raw = base64.b64decode('', validate=True)
          assert hashlib.sha256(raw).hexdigest() == '444fcc80243e7730b4571f34c97e9f5a77410bb15f47f3ad439a93c915ea2549'
          path = pathlib.Path(os.environ['RUNNER_TEMP'])/'imghost-positive-owned-sdk.py'
          with path.open('xb') as f: f.write(raw)
          print('NATIVE_INPUT_CONTROL_SDK_SOURCE', len(raw), hashlib.sha256(raw).hexdigest())
          PYSDK
          python3 "$RUNNER_TEMP/imghost-positive-owned-sdk.py" tools
          python3 - <<'PY'
          import os, shutil
          assert shutil.disk_usage('/').free >= 8*1024**3, 'hosted build requires8GiB headroom'
          assert os.environ['GITHUB_SHA'] == os.environ['GITHUB_WORKFLOW_SHA'], 'workflow/probe drift'
          print('NATIVE_INPUT_CONTROL_PROBE', os.environ['GITHUB_SHA'], os.environ['GITHUB_RUN_ID'], os.environ['GITHUB_RUN_ATTEMPT'], os.environ['PLATFORM'])
          print('NATIVE_INPUT_CONTROL_IMAGE', os.environ.get('ImageOS'), os.environ.get('ImageVersion'))
          PY
          mkdir "$RUNNER_TEMP/imghost-native-input-control"
          printf 'CONTROL_RECEIPTS=%s\n' "$RUNNER_TEMP/imghost-native-input-control" >> "$GITHUB_ENV"
      - name: Materialize pinned hosted-only controller
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, os, pathlib
          raw = base64.b64decode('', validate=True)
          assert hashlib.sha256(raw).hexdigest() == 'cdb1651ea3bd5894b5607ed6d7553bdde473f06153625106fcaba7470a69719c'
          path = pathlib.Path(os.environ['RUNNER_TEMP'])/'imghost-positive-controller.py'
          with path.open('xb') as f: f.write(raw)
          print('NATIVE_INPUT_CONTROL_CONTROLLER', len(raw), hashlib.sha256(raw).hexdigest())
          PY
          python3 "$RUNNER_TEMP/imghost-positive-controller.py" prepare
      - name: One selected real native companion, original16 NOT_INVOKED
        shell: bash
        working-directory: frontend/imghost
        run: |
          set -euo pipefail
          if [[ "$PLATFORM" == iOS ]]; then
            # Existing provider's available-device selection, not a declared SDK/runtime pin.
            python3 "$RUNNER_TEMP/imghost-positive-owned-sdk.py" devices
            DEVICE=$(python3 - "$CONTROL_RECEIPTS/devices.json" <<'PY'
          import json, pathlib, sys, uuid
          p=pathlib.Path(sys.argv[1]); assert p.stat().st_size<=262144
          d=json.loads(p.read_text()); a=[(k,v) for k,vs in d['devices'].items() if 'iOS' in k for v in vs if v['name'].startswith('iPhone')]
          assert a, 'no available iPhone, no provider replacement'
          k,v=a[0]; device=v['udid']; assert str(uuid.UUID(device)).upper()==device.upper()
          print('NATIVE_INPUT_CONTROL_DEVICE '+json.dumps({'runtime':k,'name':v['name'],'udid':device,'available':v.get('isAvailable')},sort_keys=True), file=sys.stderr)
          print(device)
          PY
            )
            DESTINATION="platform=iOS Simulator,id=$DEVICE"
          else
            DESTINATION='platform=macOS'
          fi
          printf 'NATIVE_INPUT_CONTROL_SELECTION %s %s\n' "$PLATFORM" "$DESTINATION"
          xcodebuild -project imghost.xcodeproj -scheme "ResetCodeEntry-$PLATFORM" -configuration Debug \
            -destination "$DESTINATION" -jobs 2 -parallel-testing-enabled NO \
            -test-timeouts-enabled YES -default-test-execution-time-allowance 120 \
            -maximum-test-execution-time-allowance 120 -collect-test-diagnostics never \
            -only-testing:"ResetCodeEntryUITests-$PLATFORM/ResetCodeEntryUITests/testNativePasswordInputHasPositiveAndReversibleValidationControl" \
            -derivedDataPath "$RUNNER_TEMP/imghost-native-input-derived" \
            -resultBundlePath "$RUNNER_TEMP/imghost-native-input.xcresult" \
            CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= CODE_SIGN_ENTITLEMENTS= \
            test 2>&1 | tee "$CONTROL_RECEIPTS/native-ui.log"
      - name: Require intact named outcome and all real validation transitions
        shell: bash
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/imghost-positive-controller.py" accept
      - name: Exact source recheck, no products or host cleanup/absence claims
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f "$CONTROL_RECEIPTS/prepared.json"
          python3 "$RUNNER_TEMP/imghost-positive-controller.py" post
          df -h /
          printf '%s\n' 'NATIVE_INPUT_CONTROL_LIMITS original16_NOT_INVOKED; no submit/delivery/security/physical-device/SDK-process-cleanup proof; no artifact upload or product download'
