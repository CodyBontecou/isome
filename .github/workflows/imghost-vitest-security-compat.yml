name: Imghost aligned test-tool critical security and full named compatibility qualification
on:
  push:
    branches: [prep/qualification/imghost-vitest-security-compat-20261006]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      max-parallel: 1
      fail-fast: true
      matrix:
        include:
          - pr: '10'
            head: ac727c69d1cd5861d121dbc5930c3c1473d2aac4
          - pr: '9'
            head: c132ecaaa55f64a6d5ce3df70b183cdb55a8cff3
    env:
      IMGHOST_PR: ${{ matrix.pr }}
      IMGHOST_SOURCE_HEAD: ${{ matrix.head }}
      NO_COLOR: '1'
      FORCE_COLOR: '0'
      NPM_CONFIG_REGISTRY: https://registry.npmjs.org
    steps:
      - name: Cloud resource admission before downloads
        shell: bash
        run: |
          set -euo pipefail
          df -h /
          free -h
          python3 - <<'PYTHON'
          import os,shutil
          assert os.environ['GITHUB_SHA']==os.environ['GITHUB_WORKFLOW_SHA']
          assert os.environ['RUNNER_ENVIRONMENT']=='github-hosted'
          assert shutil.disk_usage('/').free>=10*1024**3
          available=next(int(x.split()[1])*1024 for x in open('/proc/meminfo') if x.startswith('MemAvailable:'))
          assert available>=3*1024**3
          PYTHON
      - name: Checkout immutable complete backend source and root manifests
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: CodyBontecou/imghost
          ref: ${{ matrix.head }}
          path: imghost-source
          fetch-depth: 1
          lfs: false
          submodules: false
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /package.json
            /package-lock.json
            /backend/img-host/
      - name: Checkout exact already-qualified patched ZIP manifests
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: CodyBontecou/imghost
          ref: ac727c69d1cd5861d121dbc5930c3c1473d2aac4
          path: imghost-fixed-manifests
          fetch-depth: 1
          lfs: false
          submodules: false
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /package.json
            /package-lock.json
            /backend/img-host/package.json
            /backend/img-host/package-lock.json
      - name: Exact existing Node runtime family
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.3'
          check-latest: false
      - name: Materialize pinned controller and original named terminal inventories
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYTHON'
          import os,base64,hashlib,json
          from pathlib import Path
          rows=[{'name': 'imghost-vitest-controller.py', 'bytes': 14700, 'sha256': 'e5f4e2f069184ef018467e4572566280581bb6529ff0089f607a4df30a64e90a', 'base64': ''}, {'name': 'imghost-vitest-expected-names.json', 'bytes': 65444, 'sha256': 'c993f37cd11aaa6e0e3c5afc8ab936f10f9359c2820d9c5fdf5cb4fc806f05d2', 'base64': ''}]
          for row in rows:
              data=base64.b64decode(row['base64'],validate=True)
              assert len(data)==row['bytes'] and hashlib.sha256(data).hexdigest()==row['sha256']
              path=Path(os.environ['RUNNER_TEMP'])/row['name']
              assert not path.exists()
              path.write_bytes(data)
              print('IMGHOST_VITEST_SOURCE '+json.dumps({k:v for k,v in row.items() if k!='base64'},sort_keys=True),flush=True)
          PYTHON
          python3 -m py_compile "$RUNNER_TEMP/imghost-vitest-controller.py"
          test "$(node --version)" = v22.23.3
          test "$(npm --version)" = 10.9.9
          node --version
          npm --version
          python3 "$RUNNER_TEMP/imghost-vitest-controller.py" before
      - name: Generate aligned fixed test-tool lock in cloud without scripts or forced overrides
        working-directory: imghost-source/backend/img-host
        shell: bash
        run: |
          set -euo pipefail
          timeout --kill-after=2s 120s npm install vitest@4.1.11 @vitest/coverage-v8@4.1.11 --package-lock-only --ignore-scripts --legacy-peer-deps --no-audit --no-fund
          python3 "$RUNNER_TEMP/imghost-vitest-controller.py" generated
      - name: Install exact candidate lock with existing install policy
        working-directory: imghost-source/backend/img-host
        shell: bash
        run: |
          set -euo pipefail
          timeout --kill-after=2s 180s npm ci --legacy-peer-deps --no-audit --no-fund
          python3 "$RUNNER_TEMP/imghost-vitest-controller.py" installed
      - name: Full unchanged original suite and two-worker limit with additive machine reporter
        working-directory: imghost-source/backend/img-host
        shell: bash
        run: |
          set -euo pipefail
          timeout --kill-after=2s 180s npm test -- --maxWorkers=2 --reporter=verbose --reporter=json --outputFile="$RUNNER_TEMP/imghost-vitest-$IMGHOST_PR/tests.json" | tee "$RUNNER_TEMP/imghost-vitest-$IMGHOST_PR/tests.log"
      - name: Fresh keyed full and production advisory gates and exact candidate export
        working-directory: imghost-source/backend/img-host
        shell: bash
        run: |
          set -euo pipefail
          set +e
          timeout --kill-after=2s 120s npm audit --package-lock-only --ignore-scripts --legacy-peer-deps --json > "$RUNNER_TEMP/imghost-vitest-$IMGHOST_PR/audit-full.json"
          status=$?
          set -e
          test "$status" = 0 || test "$status" = 1
          timeout --kill-after=2s 120s npm audit --package-lock-only --omit=dev --ignore-scripts --legacy-peer-deps --json > "$RUNNER_TEMP/imghost-vitest-$IMGHOST_PR/audit-prod.json"
          python3 "$RUNNER_TEMP/imghost-vitest-controller.py" finished
      - name: Final host resource observation
        if: always()
        shell: bash
        run: |
          df -h /
          free -h
