name: Imghost owned SDK timeout evidence controls
on:
  push:
    branches: [prep/qualification/imghost-sdk-timeout-evidence-20261005]
    paths: [.github/workflows/imghost-sdk-timeout-evidence.yml]
permissions:
  contents: read
concurrency:
  group: imghost-sdk-timeout-evidence-${{ github.ref }}
  cancel-in-progress: false
jobs:
  finite-owned-root-controls:
    runs-on: macos-15
    timeout-minutes: 5
    env:
      SDK_HELPER_SHA256: 958e0fb2357f8c4b3c918487eeddac62c067be9c41a5c080cd40ca4934d624df
      SDK_CONTROLS_SHA256: 307ef0dde08cfa99f02fc68119004b8597b71fda178cdeb86bdae1a57da34f0b
      GITHUB_WORKFLOW_SHA: ${{ github.workflow_sha }}
    steps:
      - name: Materialize exact helper and finite controls, no checkout or SDK call
        shell: bash
        run: |
          set -euo pipefail
          df -h /
          python3 - <<'PYTHON'
          import base64,hashlib,os,pathlib,shutil
          assert os.environ['GITHUB_ACTIONS']=='true' and os.environ['RUNNER_OS']=='macOS'
          assert os.environ['GITHUB_SHA']==os.environ['GITHUB_WORKFLOW_SHA']
          assert shutil.disk_usage('/').free>=8*1024**3
          root=pathlib.Path(os.environ['RUNNER_TEMP'])
          assert root.is_absolute() and root.is_dir() and not root.is_symlink()
          raw=base64.b64decode("",validate=True)
          assert hashlib.sha256(raw).hexdigest()==os.environ["SDK_HELPER_SHA256"]
          with (root/"imghost-sdk-timeout-helper.py").open("xb") as stream: stream.write(raw)
          raw=base64.b64decode("",validate=True)
          assert hashlib.sha256(raw).hexdigest()==os.environ["SDK_CONTROLS_SHA256"]
          with (root/"imghost-sdk-timeout-controls.py").open("xb") as stream: stream.write(raw)
          PYTHON
      - name: Seven finite genuine-process controls, no simulator or native app
        shell: bash
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/imghost-sdk-timeout-controls.py" "$RUNNER_TEMP/imghost-sdk-timeout-helper.py"
          printf '%s\n' 'SDK_TIMEOUT_LIMITS diagnostic-only candidate; not adopted by native workflow; no SDK calls, device boot, native rerun, artifacts, product ref/PR or security claim'
