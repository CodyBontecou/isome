name: Imghost Linux separate log cache limit controls
on:
  push:
    branches: [prep/qualification/imghost-root-wrangler-limits-20261006]
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Cloud identity and resource admission, no checkout or installation
        shell: bash
        run: |
          set -euo pipefail
          df -h /
          free -h
          python3 - <<'PY'
          import os,shutil
          assert os.environ['RUNNER_ENVIRONMENT']=='github-hosted'
          assert os.environ['RUNNER_OS']=='Linux'
          assert os.environ['GITHUB_RUN_ATTEMPT']=='1'
          assert os.environ['GITHUB_SHA']==os.environ['GITHUB_WORKFLOW_SHA']
          assert shutil.disk_usage('/').free>=10*1024**3
          available=next(int(x.split()[1])*1024 for x in open('/proc/meminfo') if x.startswith('MemAvailable:'))
          assert available>=3*1024**3
          PY
      - name: Exact runner and control sources, cloud syntax then six sequential finite cases
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/imghost-root-wrangler-limits-owned"
          test ! -e "$root"
          mkdir -m 700 "$root"
          python3 - "$root" <<'PY'
          from pathlib import Path
          import sys,base64,hashlib
          root=Path(sys.argv[1])
          values=[('runner.py','',7855,'36744856e6b2965ced89451ef15f72dcd39d3ca934dc32efb678830803889f3a'),('controls.py','',8083,'7fe349bbd13ed7df7e117b64f93b681f996a639c94eb85c1713961801c78c086')]
          for name,encoded,size,sha in values:
              data=base64.b64decode(encoded,validate=True)
              assert len(data)==size and hashlib.sha256(data).hexdigest()==sha
              path=root/name
              assert not path.exists()
              path.write_bytes(data)
          PY
          timeout --kill-after=2s 12s python3 -m py_compile "$root/runner.py" "$root/controls.py"
          set +e
          (
            set -C
            ulimit -H -f 65536
            ulimit -S -f 128
            timeout --kill-after=2s 110s python3 "$root/controls.py" "$root" > "$root/control-console.txt" 2>&1
          )
          status=$?
          set -e
          python3 - "$root/control-console.txt" "$status" <<'PY'
          from pathlib import Path
          import sys,json,hashlib
          path=Path(sys.argv[1])
          assert path.is_file() and not path.is_symlink() and path.stat().st_size<=128*1024
          data=path.read_bytes()
          print(data.decode(),end='',flush=True)
          print('IMGHOST_ROOT_LIMITS_RETURN '+json.dumps({'exit_status':sys.argv[2],'output_bytes':len(data),'sha256':hashlib.sha256(data).hexdigest(),'limits':'Completed combined control stdout/stderr exported before exit gate. Outer shell file limit soft128KiB/hard64MiB is measured in controls; completed size guard is post-write, while inner runner log cap is also enforced before sink writes. GNU wrapper timeout not owned descendants/global cleanup proof.'},sort_keys=True),flush=True)
          PY
          test "$status" = 0
      - name: Final resource observations
        if: always()
        shell: bash
        run: |
          df -h /
          free -h
