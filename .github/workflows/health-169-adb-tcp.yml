name: Android ADB private TCP ownership control
on:
  push:
    branches: [prep/qualification/health-169-adb-tcp-20261006]
    paths: [.github/workflows/health-169-adb-tcp.yml]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  adb-private-tcp:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Resource admission before SDK bootstrap
        shell: bash
        run: |
          set -euo pipefail
          df -h /
          free -h
          uptime
          python3 - <<'PY'
          import shutil
          from pathlib import Path
          memory = dict(line.split(':', 1) for line in Path('/proc/meminfo').read_text().splitlines())
          if shutil.disk_usage('/').free < 8*1024**3 or int(memory['MemAvailable'].split()[0])*1024 < 2*1024**3:
              raise RuntimeError('Cloud SDK control admission STOP')
          print('HEALTHMD_ADB_RESOURCE_ESTIMATE: <=500MiB additional bootstrap/control disk estimate, not allocation guarantee')
          PY
      - name: Materialize private controller
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, os
          from pathlib import Path
          data = base64.b64decode('', validate=True)
          if len(data) != 14204 or hashlib.sha256(data).hexdigest() != 'cb5d56e5fc047fe70064e607c098ce9b58af060a3b8ce503f2f8d8f7c332a72c':
              raise RuntimeError('Private controller bytes STOP')
          p = Path(os.environ['RUNNER_TEMP']).resolve(strict=True)/'healthmd-adb-tcp-owned.py'
          with p.open('xb') as f:
              f.write(data)
          if p.read_bytes() != data:
              raise RuntimeError('Private controller readback STOP')
          PY
          python3 -m py_compile "$RUNNER_TEMP/healthmd-adb-tcp-owned.py"
      - name: Select installed Android platform-tools (no emulator)
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: platform-tools
      - name: Qualify private host-version and owned shutdown
        shell: bash
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/healthmd-adb-tcp-owned.py"
      - name: Final resource observation (not cleanup or native acceptance)
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          df -h /
          free -h
          echo 'HEALTHMD_ADB_BOUNDARY: one private discovery-disabled foreground host-version/owned SIGINT/reap/pipeclosure/negative endpoint control. No SDK client/default server/devices/emulator/app/Apple SDK resume/adoption; no universal cleanup/origin proof; goal incomplete.'
