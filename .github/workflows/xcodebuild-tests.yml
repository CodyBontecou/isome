name: xcodebuild tests

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: xcodebuild-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: IsoMe XCTest
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Test iOS runner guardrails
        run: python3 -m unittest discover -s scripts -p test_test_ios.py

      - name: Run IsoMe tests
        run: scripts/test-ios.sh --result-bundle-path artifacts/test-results/IsoMe.xcresult

      - name: Upload xcresult on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: IsoMe.xcresult
          path: artifacts/test-results/IsoMe.xcresult
          if-no-files-found: ignore
