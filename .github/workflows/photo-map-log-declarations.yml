name: Photo map simulator log declarations

on:
  push:
    branches: [prep/iso-65-66-log-declarations-probe-20261005]
    paths: [.github/workflows/photo-map-log-declarations.yml]

permissions:
  contents: read

concurrency:
  group: photo-map-log-declarations-${{ github.ref }}
  cancel-in-progress: false

jobs:
  declarations:
    if: github.event.repository.private == false
    runs-on: macos-latest
    timeout-minutes: 8
    steps:
      - name: Exact hosted SDK provenance
        shell: bash
        run: |
          set -euo pipefail
          printf 'HEAD=%s\nWORKFLOW_SHA=%s\nImageOS=%s\nImageVersion=%s\n' "$GITHUB_SHA" "$GITHUB_WORKFLOW_SHA" "${ImageOS:-unknown}" "${ImageVersion:-unknown}"
          sw_vers
          xcodebuild -version
          xcodebuild -showsdks
          xcrun swift --version

      - name: Installed simulator and guest log help only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, json, os, re, subprocess

          total = 0
          def run(argv, label, timeout=12, cap=24*1024, print_text=True):
              global total
              process = subprocess.Popen(argv, stdout=subprocess.PIPE, stderr=subprocess.PIPE)
              try:
                  stdout, stderr = process.communicate(timeout=timeout)
              except subprocess.TimeoutExpired as error:
                  out, err = error.stdout or b'', error.stderr or b''
                  record = json.dumps({
                      'label': label, 'argv': argv, 'timeout_seconds': timeout,
                      'owned_root_pid': process.pid,
                      'root_returncode_before_cleanup': process.poll(),
                      'partial_stdout_bytes': len(out), 'partial_stderr_bytes': len(err),
                      'partial_stdout_b64': base64.b64encode(out[:12*1024]).decode('ascii'),
                      'partial_stderr_b64': base64.b64encode(err[:12*1024]).decode('ascii'),
                      'partial_truncated': len(out) > 12*1024 or len(err) > 12*1024,
                      'head': os.environ['GITHUB_SHA'],
                      'workflow_sha': os.environ['GITHUB_WORKFLOW_SHA'],
                      'limits': 'Partial streams and root poll only; no complete help, cause or process-absence proof'
                  })
                  try:
                      assert len(record.encode()) <= 48*1024, 'Timeout metadata limit exceeded'
                      print('LOG_DECLARATION_TIMEOUT ' + record, flush=True)
                  finally:
                      try:
                          if process.poll() is None: process.kill()
                          code = process.wait(timeout=2)
                          print('LOG_DECLARATION_ROOT_CLEANUP ' + json.dumps({
                              'owned_root_pid': process.pid, 'reaped_returncode': code,
                              'head': os.environ['GITHUB_SHA'],
                              'workflow_sha': os.environ['GITHUB_WORKFLOW_SHA'],
                              'limits': 'Owned root only; descendants and SDK service absence unverified'
                          }), flush=True)
                      except Exception as cleanup_error:
                          print('LOG_DECLARATION_ROOT_CLEANUP_UNVERIFIED ' + json.dumps({
                              'owned_root_pid': process.pid,
                              'error': str(cleanup_error)[:240]
                          }), flush=True)
                          raise
                      finally:
                          process.stdout.close()
                          process.stderr.close()
                  raise
              size = len(stdout) + len(stderr)
              assert size <= cap, 'Per-command output limit exceeded'
              total += size
              assert total <= 512*1024, 'Cumulative output limit exceeded'
              text = (stdout + stderr).decode('utf-8', errors='strict')
              print('LOG_DECLARATION_COMMAND ' + json.dumps({
                  'label': label, 'argv': argv, 'exit_code': process.returncode,
                  'bytes': size, 'head': os.environ['GITHUB_SHA'],
                  'workflow_sha': os.environ['GITHUB_WORKFLOW_SHA']
              }), flush=True)
              if print_text: print(text, flush=True)
              assert process.returncode == 0, 'Command failed; no retry or alternate'
              return stdout, text

          def declared(text, name):
              assert re.search(r'^\s*' + re.escape(name) + r'\s+', text, re.M), (
                  'Required command not declared: ' + name)

          _, wrapper_help = run(['xcrun', '--help'], 'xcrun-root-help')
          assert re.search(r'^\s*(?:-[A-Za-z],?\s+)?--find(?:\s|$)', wrapper_help, re.M), (
              'xcrun --find option not declared; no guessed alternative')
          resolved, _ = run(['xcrun', '--find', 'simctl'], 'xcrun-find-simctl')
          paths = resolved.decode('utf-8', errors='strict').splitlines()
          assert len(paths) == 1 and len(paths[0].encode()) <= 4096, 'Tool locator malformed'
          tool_path = paths[0]
          assert os.path.isabs(tool_path) and os.path.basename(tool_path) == 'simctl'
          assert os.path.isfile(tool_path), 'Resolved simctl file unavailable; no fallback'
          record = json.dumps({
              'tool': 'simctl', 'resolved_path': tool_path,
              'head': os.environ['GITHUB_SHA'], 'workflow_sha': os.environ['GITHUB_WORKFLOW_SHA'],
              'limits': 'Declared lookup and file predicate only; no direct invocation, binary identity or cause proof'
          })
          assert len(record.encode()) <= 8*1024, 'Resolution metadata limit exceeded'
          print('LOG_DECLARATION_RESOLUTION ' + record, flush=True)
          _, root = run(['xcrun', 'simctl', 'help'], 'simctl-root-help')
          for name in ['list', 'boot', 'bootstatus', 'spawn', 'shutdown']:
              declared(root, name)
              run(['xcrun', 'simctl', 'help', name], 'simctl-' + name + '-help')
          data, _ = run(['xcrun', 'simctl', 'list', 'devices', 'available', '-j'],
                        'available-devices', cap=256*1024, print_text=False)
          inventory = json.loads(data)
          candidates = []
          for runtime, devices in inventory['devices'].items():
              if not runtime.startswith('com.apple.CoreSimulator.SimRuntime.iOS-'): continue
              for device in devices:
                  if device['isAvailable'] and device['state'] == 'Shutdown' and device['name'].startswith('iPhone'):
                      candidates.append((runtime, device['name'], device['udid']))
          assert candidates, 'No available shutdown preinstalled iPhone; no download/create fallback'
          runtime, name, udid = sorted(candidates)[0]
          assert re.fullmatch(r'[0-9A-Fa-f]{8}(?:-[0-9A-Fa-f]{4}){3}-[0-9A-Fa-f]{12}', udid)
          print('LOG_DECLARATION_DEVICE ' + json.dumps({
              'runtime': runtime, 'name': name, 'udid': udid,
              'head': os.environ['GITHUB_SHA'], 'workflow_sha': os.environ['GITHUB_WORKFLOW_SHA']
          }), flush=True)
          attempted_boot = False
          try:
              attempted_boot = True
              run(['xcrun', 'simctl', 'boot', udid], 'owned-boot-request', timeout=30)
              run(['xcrun', 'simctl', 'bootstatus', udid, '-b'], 'owned-boot-status', timeout=150)
              guest = ['xcrun', 'simctl', 'spawn', udid, 'log']
              _, log_root = run(guest + ['help'], 'guest-log-root-help')
              for name in ['show', 'stream']:
                  declared(log_root, name)
                  run(guest + ['help', name], 'guest-log-' + name + '-help')
          finally:
              if attempted_boot:
                  run(['xcrun', 'simctl', 'shutdown', udid], 'owned-shutdown-request', timeout=30)
                  data, _ = run(['xcrun', 'simctl', 'list', 'devices', 'available', '-j'],
                                'post-shutdown-devices', cap=256*1024, print_text=False)
                  states = [d['state'] for rows in json.loads(data)['devices'].values()
                            for d in rows if d['udid'] == udid]
                  assert states == ['Shutdown'], 'Owned device shutdown unverified'
                  print('LOG_DECLARATION_CLEANUP ' + json.dumps({
                      'udid': udid, 'observed_state': states[0],
                      'limits': 'Observable simulator state, not process-absence proof'
                  }), flush=True)
          print('LOG_DECLARATIONS_ONLY ' + json.dumps({
              'head': os.environ['GITHUB_SHA'], 'workflow_sha': os.environ['GITHUB_WORKFLOW_SHA'],
              'output_bytes': total, 'udid': udid, 'runtime': runtime,
              'limits': 'Installed declarations only. No emitter/app/test/capture/routing/security acceptance. Output limits are post-return, not preemptive allocation bounds. Guest help is not macOS host-log data or actual product qualification.'
          }), flush=True)
          PY
