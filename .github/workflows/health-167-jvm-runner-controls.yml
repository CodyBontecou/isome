name: Health167 JVM compatible Linux runner controls
on:
  push:
    branches: [prep/qualification/health-167-jvm-runner-20261006]
    paths: [.github/workflows/health-167-jvm-runner-controls.yml]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  finite-controls:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Resource admission no SDK or product
        shell: bash
        run: |
          set -euo pipefail
          df -h /
          free -h
          uptime
          python3 - <<'PY'
          import pathlib, shutil
          available = next(int(l.split()[1])*1024 for l in pathlib.Path('/proc/meminfo').read_text().splitlines() if l.startswith('MemAvailable:'))
          assert shutil.disk_usage('/').free >= 8*1024**3 and available >= 1536*1024**2
          print('HEALTH167_CONTROL_RESOURCE_GUARD', {'incremental_disk_estimate_bytes':1048576,'limits':'Estimate not measured peak or aggregate quota. Synthetic only/no SDK/download/checkout/install.'})
          PY
      - name: Materialize exact controller and runner literals
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib, base64, hashlib, os
          root = pathlib.Path(os.environ['RUNNER_TEMP']).resolve(strict=True)
          sources = [('healthmd-build-runner.py', 7445, '875d0c360d19768ee28ce59b60286f9ba381c11b9a27f64cfad4338fdd798303', ''), ('healthmd-build-controls.py', 7299, 'baf368aaa37536fb1cd9c5ae95ef5e6b727da0d6dc22416abb94df710f3d629e', '')]
          for name, count, sha, encoded in sources:
              body = base64.b64decode(encoded, validate=True)
              assert len(body) == count and hashlib.sha256(body).hexdigest() == sha
              path = root/name
              with path.open('xb') as stream: stream.write(body)
              print('HEALTH167_CONTROL_SOURCE', name, count, sha)
          PY
      - name: Qualify six unchanged finite cases
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile "$RUNNER_TEMP/healthmd-build-runner.py" "$RUNNER_TEMP/healthmd-build-controls.py"
          timeout --signal=TERM --kill-after=2s 45s python3 -u "$RUNNER_TEMP/healthmd-build-controls.py"
