name: Imghost root-only exact Wrangler candidate virtual graph and zero advisory gates
on:
  push:
    branches: [prep/qualification/imghost-root-wrangler-security-20261006]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    env:
      NPM_CONFIG_REGISTRY: https://registry.npmjs.org/
      NPM_CONFIG_OMIT: ''
      NPM_CONFIG_INCLUDE: ''
      NPM_CONFIG_IGNORE_SCRIPTS: 'true'
      NPM_CONFIG_UPDATE_NOTIFIER: 'false'
      NPM_CONFIG_FETCH_RETRIES: '0'
      NPM_CONFIG_FETCH_TIMEOUT: '30000'
      NODE_ENV: ''
    steps:
      - name: Cloud admission before downloads
        shell: bash
        run: |
          set -euo pipefail
          df -h /
          free -h
          python3 - <<'PYTHON'
          import os,shutil
          assert os.environ['RUNNER_ENVIRONMENT']=='github-hosted'
          assert os.environ['GITHUB_SHA']==os.environ['GITHUB_WORKFLOW_SHA']
          assert shutil.disk_usage('/').free>=10*1024**3
          available=next(int(x.split()[1])*1024 for x in open('/proc/meminfo') if x.startswith('MemAvailable:'))
          assert available>=3*1024**3
          PYTHON
      - name: Exact PR10 four manifests only, no installed graph
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: CodyBontecou/imghost
          ref: ac727c69d1cd5861d121dbc5930c3c1473d2aac4
          path: imghost-source
          fetch-depth: 1
          lfs: false
          submodules: false
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /package.json
            /package-lock.json
            /backend/img-host/package.json
            /backend/img-host/package-lock.json
      - name: Pinned existing runtime family, no dependency installation
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.3'
          check-latest: false
      - name: Materialize exact controller and record frozen source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYTHON'
          import os,json,hashlib,base64
          from pathlib import Path
          row={'name': 'controller.py', 'bytes': 11435, 'sha256': '32a9b939b4f70d3f73d897867f0c7382ff70583be092f160a6f16131c743b808', 'base64': ''}
          data=base64.b64decode(row['base64'],validate=True)
          assert len(data)==row['bytes'] and hashlib.sha256(data).hexdigest()==row['sha256']
          path=Path(os.environ['RUNNER_TEMP'])/'imghost-root-wrangler-controller.py'
          assert not path.exists()
          path.write_bytes(data)
          print('IMGHOST_ROOT_WRANGLER_CONTROLLER_SOURCE '+json.dumps({k:v for k,v in row.items() if k!='base64'},sort_keys=True),flush=True)
          PYTHON
          python3 -m py_compile "$RUNNER_TEMP/imghost-root-wrangler-controller.py"
          test "$(node --version)" = v22.23.3
          test "$(npm --version)" = 10.9.9
          python3 "$RUNNER_TEMP/imghost-root-wrangler-controller.py" before
      - name: Once generate exact requested root lock only with scripts disabled
        working-directory: imghost-source
        shell: bash
        run: |
          set -euo pipefail
          export NPM_CONFIG_CACHE="$RUNNER_TEMP/imghost-root-wrangler-cache"
          root="$RUNNER_TEMP/imghost-root-wrangler-owned"
          set +e
          (
            set -C
            ulimit -f 8192
            timeout --kill-after=2s 120s npm install wrangler@4.147.0 --save-exact --package-lock-only --ignore-scripts --legacy-peer-deps --no-audit --no-fund > "$root/generation.stdout" 2> "$root/generation.stderr"
          )
          status=$?
          set -e
          printf '%s\n' "$status" > "$root/generation.exit"
          python3 "$RUNNER_TEMP/imghost-root-wrangler-controller.py" generated
      - name: Fresh root full and production keyed audits, raw exports before mandatory gates
        working-directory: imghost-source
        shell: bash
        run: |
          set -euo pipefail
          export NPM_CONFIG_CACHE="$RUNNER_TEMP/imghost-root-wrangler-cache"
          root="$RUNNER_TEMP/imghost-root-wrangler-owned"
          for mode in full prod; do
            args=(audit --package-lock-only --ignore-scripts --legacy-peer-deps)
            if [ "$mode" = prod ]; then args+=(--omit=dev); fi
            args+=(--json)
            set +e
            (
              set -C
              ulimit -f 8192
              timeout --kill-after=2s 120s npm "${args[@]}" > "$root/audit-$mode.json" 2> "$root/audit-$mode.stderr"
            )
            status=$?
            set -e
            printf '%s\n' "$status" > "$root/audit-$mode.exit"
          done
          python3 "$RUNNER_TEMP/imghost-root-wrangler-controller.py" finished
      - name: Final resource observations only
        if: always()
        shell: bash
        run: |
          df -h /
          free -h
