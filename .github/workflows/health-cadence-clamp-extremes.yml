name: Health cadence integer clamp arithmetic qualification
on:
  push:
    branches: [prep/qualification/health-cadence-clamp-extremes-20261005]
    paths: [.github/workflows/health-cadence-clamp-extremes.yml]
permissions:
  contents: read
concurrency:
  group: health-cadence-clamp-${{ github.ref }}
  cancel-in-progress: false
jobs:
  literal-function-arithmetic:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GITHUB_WORKFLOW_SHA: ${{ github.workflow_sha }}
      CLAMP_ROOT: ${{ runner.temp }}/health-cadence-clamp-qualification
    steps:
      - name: Materialize pinned source excerpts, no checkout or installation
        shell: bash
        run: |
          set -euo pipefail
          df -h /
          python3 - <<'PYTHON'
          import base64,hashlib,os,pathlib,shutil
          assert os.environ['GITHUB_ACTIONS']=='true' and os.environ['RUNNER_OS']=='Linux'
          assert os.environ['GITHUB_SHA']==os.environ['GITHUB_WORKFLOW_SHA']
          assert shutil.disk_usage('/').free>=8*1024**3
          parent=pathlib.Path(os.environ['RUNNER_TEMP'])
          assert parent.is_absolute() and parent.is_dir() and not parent.is_symlink()
          root=pathlib.Path(os.environ['CLAMP_ROOT'])
          assert root.parent==parent and not root.exists()
          root.mkdir(mode=0o700)
          raw=base64.b64decode("",validate=True)
          assert hashlib.sha256(raw).hexdigest()=="97de6f6aeb486d97c7279bc0a0012d13d6d02751d053d040ca7e537e0491280b"
          with (root/"base.swift").open("xb") as stream: stream.write(raw)
          raw=base64.b64decode("",validate=True)
          assert hashlib.sha256(raw).hexdigest()=="efb6705ee2a79f427b8fd8d7231493de5f5a378089c1ff1fee02b7c4b91c82ef"
          with (root/"candidate.swift").open("xb") as stream: stream.write(raw)
          raw=base64.b64decode("",validate=True)
          assert hashlib.sha256(raw).hexdigest()=="db4cb4d14f747cba4ea77f29b0b63871b2664a315690ecebdbb1cbb7b40ed708"
          with (root/"controls.swift").open("xb") as stream: stream.write(raw)
          raw=base64.b64decode("",validate=True)
          assert hashlib.sha256(raw).hexdigest()=="e3866a0fc7012773df8e37019ec1f74f11520a1170d73040f22cc883ef0ac2e8"
          with (root/"controller.py").open("xb") as stream: stream.write(raw)
          raw=base64.b64decode("",validate=True)
          assert hashlib.sha256(raw).hexdigest()=="07c7f3740b1898303b13687a55d9c5a4acc2c2b9fb275e5f16bb4287f173b9bd"
          with (root/"edit.json").open("xb") as stream: stream.write(raw)
          PYTHON
      - name: Compile six literal-function controls and isolate original extreme
        shell: bash
        run: |
          set -euo pipefail
          python3 "$CLAMP_ROOT/controller.py"
          echo 'CLAMP_LIMITS standalone function arithmetic only; not full Apple model/decoder/cadence/SDK-native-provider or product-ref/PR adoption'
