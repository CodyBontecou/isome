name: Android emulator bounded version failure-text diagnostic
on:
  push:
    branches: [prep/qualification/health-169-emulator-failure-text-20261006]
    paths: [.github/workflows/health-169-emulator-failure-text.yml]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  emulator-help-version:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Resource admission before SDK bootstrap
        shell: bash
        run: |
          set -euo pipefail
          df -h /
          free -h
          uptime
          python3 - <<'PY'
          import shutil
          from pathlib import Path
          memory = dict(line.split(':', 1) for line in Path('/proc/meminfo').read_text().splitlines())
          if shutil.disk_usage('/').free < 16*1024**3 or int(memory['MemAvailable'].split()[0])*1024 < 4*1024**3:
              raise RuntimeError('Cloud SDK control admission STOP')
          print('HEALTHMD_ADB_RESOURCE_ESTIMATE: <=6GiB additional bootstrap/emulator component peak disk estimate, not allocation guarantee')
          PY
      - name: Materialize byte-pinned helper and Linux caller (no product source)
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']).resolve(strict=True)
          for name, size, digest, encoded in [('healthmd-sdk-helper.py', 6135, 'c65f9c4508de2c6af1c681f41d25c000608ac01aa26d67e01d2a1b9357d4eba6', ''), ('healthmd-emulator-control.py', 4013, '7c74c799b15c0ae143cdcb36ef5c6b1b37355d51aeee0f22d40cb035f74a5bed', '')]:
              data = base64.b64decode(encoded, validate=True)
              if len(data) != size or hashlib.sha256(data).hexdigest() != digest:
                  raise RuntimeError('SDK control materialization bytes STOP')
              with (root/name).open('xb') as output:
                  output.write(data)
              if (root/name).read_bytes() != data:
                  raise RuntimeError('SDK control materialization readback STOP')
          PY
          python3 -m py_compile "$RUNNER_TEMP/healthmd-sdk-helper.py" "$RUNNER_TEMP/healthmd-emulator-control.py"
      - name: Select installed Android platform-tools (no emulator)
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: platform-tools emulator
      - name: Post-install admission before CLI controls
        shell: bash
        run: |
          set -euo pipefail
          df -h /
          free -h
          python3 - <<'PY'
          import shutil
          from pathlib import Path
          m = dict(line.split(':',1) for line in Path('/proc/meminfo').read_text().splitlines())
          if shutil.disk_usage('/').free < 8*1024**3 or int(m['MemAvailable'].split()[0])*1024 < 2*1024**3:
              raise RuntimeError('Post emulator install resource STOP')
          PY
      - name: Observe only bounded expected emulator version failure
        shell: bash
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/healthmd-emulator-control.py"
      - name: Final resource observation (not cleanup or native acceptance)
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          df -h /
          free -h
          echo 'HEALTHMD_EMULATOR_FAILURE_BOUNDARY: one same-pinned-binary version expected127 diagnostic/complete <=512bytebase64 failuretext; unchanged12s2s64KiB; nohelp/AVD/image/boot/server/device/app/AppleSDKresume/helperadoption/origin/globalcleanup/goal proof.'
