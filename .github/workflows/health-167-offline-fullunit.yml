name: Health167 exact offline schema full PlayDebug qualification
on:
  push:
    branches: [prep/qualification/health-167-offline-fullunit-20261006]
    paths: [.github/workflows/health-167-offline-fullunit.yml]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  full-unit:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: '2'
      HEALTHMD_CORE_SOURCE_REVISION: c3c5fa14fb4055a67cd924d11365ab5d7c6cb476
    steps:
      - name: Resource admission before checkout or downloads
        shell: bash
        run: |
          set -euo pipefail
          df -h /
          free -h
          uptime
          python3 - <<'PY'
          import pathlib, shutil
          available = next(int(l.split()[1])*1024 for l in pathlib.Path('/proc/meminfo').read_text().splitlines() if l.startswith('MemAvailable:'))
          assert shutil.disk_usage('/').free >= 20*1024**3 and available >= 4*1024**3
          print('HEALTH167_PREFLIGHT', {'disk_incremental_peak_estimate':12*1024**3,'limits':'Estimate/point guard not aggregate quota or measured peak. Original60min unitjob budget; no native/device/ADB/emulator.'})
          PY
      - name: Checkout immutable Health source no persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: CodyBontecou/health-md
          ref: c3c5fa14fb4055a67cd924d11365ab5d7c6cb476
          path: healthmd-tested
          fetch-depth: 1
          persist-credentials: false
          lfs: false
          submodules: false
      - name: Materialize exact unadopted source tuples
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib, base64, hashlib, os
          root = pathlib.Path(os.environ['RUNNER_TEMP']).resolve(strict=True)
          sources = [('healthmd-build-runner.py', 7445, '875d0c360d19768ee28ce59b60286f9ba381c11b9a27f64cfad4338fdd798303', ''), ('health167-controller.py', 14053, '3f6b1993a5bd712a59577dd3bccb5d0119d38fe55afd28dcf6d71053961cf223', ''), ('health167-fullunit.init.gradle', 5987, 'd07b1904d15c9177f907b9331031499aff689c17dd4c50bff3c1c1f7da5edaba', ''), ('health167-RawChangesServiceTest.kt', 44571, '41bc0ef75fef18c5399d93d86547c3107f405b3607176c8abf0765f33886c3b5', ''), ('health167-RawChangesSchemaValidation.kt', 1577, '47560eadbd2c688208d8277bc5bc1d97c1422f6e382e32f93daaec1970f330fa', ''), ('health167-RawChangesSchemaValidationTest.kt', 2501, '4915364dd4d9f33bc9cab46a35aa654bad4efc80dcdf9ed63844b7a9f62f0dcb', ''), ('health167-manifest.json', 1698, '3d0c4161cab0fe67e695849419f31d79ace6f7fab9f296475bc7bc1cb967a105', '')]
          for name, size, sha, encoded in sources:
              data = base64.b64decode(encoded,validate=True)
              assert len(data)==size and hashlib.sha256(data).hexdigest()==sha
              with (root/name).open('xb') as stream: stream.write(data)
              print('HEALTH167_MATERIALIZED', name, size, sha)
          PY
          python3 -m py_compile "$RUNNER_TEMP/health167-controller.py" "$RUNNER_TEMP/healthmd-build-runner.py"
          python3 -u "$RUNNER_TEMP/health167-controller.py" prepare
      - name: Set up original Java17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up original SDK command-line package selection
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: platform-tools
      - name: Original pinned Rust Android toolchain two build workers
        shell: bash
        run: python3 -u "$RUNNER_TEMP/health167-controller.py" rust
      - name: Original pinned NDK27.1.12297006
        shell: bash
        run: python3 -u "$RUNNER_TEMP/health167-controller.py" ndk
      - name: Original Gradle setup read-only cache
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          cache-read-only: true
      - name: Original wrapper validation
        uses: gradle/actions/wrapper-validation@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          min-wrapper-count: 1
      - name: Source-built RustDebug and normal Kotlin bindings check
        shell: bash
        run: python3 -u "$RUNNER_TEMP/health167-controller.py" core
      - name: Fresh unfiltered full PlayDebug JVM suite with bounded reports before gates
        shell: bash
        run: python3 -u "$RUNNER_TEMP/health167-controller.py" unit
