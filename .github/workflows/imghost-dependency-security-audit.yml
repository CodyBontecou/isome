name: Imghost frozen dependency graph advisory measurement
on:
  push:
    branches: [prep/qualification/imghost-dependency-security-audit-20261006]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    env:
      NPM_CONFIG_REGISTRY: https://registry.npmjs.org/
      NPM_CONFIG_OMIT: ''
      NPM_CONFIG_INCLUDE: ''
      NPM_CONFIG_IGNORE_SCRIPTS: 'true'
      NPM_CONFIG_UPDATE_NOTIFIER: 'false'
      NPM_CONFIG_FETCH_RETRIES: '0'
      NPM_CONFIG_FETCH_TIMEOUT: '30000'
      NODE_ENV: ''
    steps:
      - name: Cloud admission before downloads
        shell: bash
        run: |
          set -euo pipefail
          df -h /
          free -h
          python3 - <<'PYTHON'
          import os,shutil
          assert os.environ['RUNNER_ENVIRONMENT']=='github-hosted'
          assert os.environ['GITHUB_SHA']==os.environ['GITHUB_WORKFLOW_SHA']
          assert shutil.disk_usage('/').free>=10*1024**3
          available=next(int(x.split()[1])*1024 for x in open('/proc/meminfo') if x.startswith('MemAvailable:'))
          assert available>=3*1024**3
          PYTHON
      - name: Exact PR10 four manifests only, no installed graph
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: CodyBontecou/imghost
          ref: ac727c69d1cd5861d121dbc5930c3c1473d2aac4
          path: imghost-source
          fetch-depth: 1
          lfs: false
          submodules: false
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /package.json
            /package-lock.json
            /backend/img-host/package.json
            /backend/img-host/package-lock.json
      - name: Pinned existing runtime family, no dependency installation
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.3'
          check-latest: false
      - name: Materialize exact controller and record frozen source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYTHON'
          import os,json,hashlib,base64
          from pathlib import Path
          row={'name': 'controller.py', 'bytes': 6861, 'sha256': 'bea9b736c399e4c843835f033382f3192eb746b10dd0f8ef58e437dd6f7d33d9', 'base64': ''}
          data=base64.b64decode(row['base64'],validate=True)
          assert len(data)==row['bytes'] and hashlib.sha256(data).hexdigest()==row['sha256']
          path=Path(os.environ['RUNNER_TEMP'])/'imghost-advisory-controller.py'
          assert not path.exists()
          path.write_bytes(data)
          print('IMGHOST_ADVISORY_CONTROLLER_SOURCE '+json.dumps({k:v for k,v in row.items() if k!='base64'},sort_keys=True),flush=True)
          PYTHON
          python3 -m py_compile "$RUNNER_TEMP/imghost-advisory-controller.py"
          test "$(node --version)" = v22.23.3
          test "$(npm --version)" = 10.9.9
          python3 "$RUNNER_TEMP/imghost-advisory-controller.py" prepare
      - name: Four frozen-lock reports with actual exit and UTC, no npm ci or scripts
        shell: bash
        run: |
          set -euo pipefail
          export NPM_CONFIG_CACHE="$RUNNER_TEMP/imghost-advisory-cache"
          export AUDIT_GROUP AUDIT_MODE AUDIT_START AUDIT_END AUDIT_EXIT
          for AUDIT_GROUP in backend root; do
            if [ "$AUDIT_GROUP" = backend ]; then directory="$GITHUB_WORKSPACE/imghost-source/backend/img-host"; else directory="$GITHUB_WORKSPACE/imghost-source"; fi
            for AUDIT_MODE in full prod; do
              stem="$AUDIT_GROUP-$AUDIT_MODE"
              args=(audit --package-lock-only --ignore-scripts --legacy-peer-deps)
              if [ "$AUDIT_MODE" = prod ]; then args+=(--omit=dev); fi
              args+=(--json)
              AUDIT_START=$(date -u +%Y-%m-%dT%H:%M:%SZ)
              if (cd "$directory" && timeout --kill-after=2s 75s npm "${args[@]}") > "$RUNNER_TEMP/imghost-advisory-owned/$stem.json" 2> "$RUNNER_TEMP/imghost-advisory-owned/$stem.stderr"; then AUDIT_EXIT=0; else AUDIT_EXIT=$?; fi
              AUDIT_END=$(date -u +%Y-%m-%dT%H:%M:%SZ)
              python3 "$RUNNER_TEMP/imghost-advisory-controller.py" report
            done
          done
          python3 "$RUNNER_TEMP/imghost-advisory-controller.py" finish
      - name: Final resource observations only
        if: always()
        shell: bash
        run: |
          df -h /
          free -h
