name: Imghost protected lock conflict diagnostic only
on:
  push:
    branches: [prep/qualification/imghost-vitest-lock-conflict-20261006]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    strategy:
      max-parallel: 1
      fail-fast: true
      matrix:
        include:
          - pr: '10'
            head: ac727c69d1cd5861d121dbc5930c3c1473d2aac4
    env:
      IMGHOST_PR: ${{ matrix.pr }}
      IMGHOST_SOURCE_HEAD: ${{ matrix.head }}
      NO_COLOR: '1'
      FORCE_COLOR: '0'
      NPM_CONFIG_REGISTRY: https://registry.npmjs.org
    steps:
      - name: Cloud resource admission before downloads
        shell: bash
        run: |
          set -euo pipefail
          df -h /
          free -h
          python3 - <<'PYTHON'
          import os,shutil
          assert os.environ['GITHUB_SHA']==os.environ['GITHUB_WORKFLOW_SHA']
          assert os.environ['RUNNER_ENVIRONMENT']=='github-hosted'
          assert shutil.disk_usage('/').free>=10*1024**3
          available=next(int(x.split()[1])*1024 for x in open('/proc/meminfo') if x.startswith('MemAvailable:'))
          assert available>=3*1024**3
          PYTHON
      - name: Checkout immutable complete backend source and root manifests
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: CodyBontecou/imghost
          ref: ${{ matrix.head }}
          path: imghost-source
          fetch-depth: 1
          lfs: false
          submodules: false
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /package.json
            /package-lock.json
            /backend/img-host/
      - name: Checkout exact already-qualified patched ZIP manifests
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: CodyBontecou/imghost
          ref: ac727c69d1cd5861d121dbc5930c3c1473d2aac4
          path: imghost-fixed-manifests
          fetch-depth: 1
          lfs: false
          submodules: false
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /package.json
            /package-lock.json
            /backend/img-host/package.json
            /backend/img-host/package-lock.json
      - name: Exact existing Node runtime family
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.3'
          check-latest: false
      - name: Materialize diagnostic controller only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYTHON'
          import os,base64,hashlib,json
          from pathlib import Path
          rows=[{'name': 'imghost-vitest-controller.py', 'bytes': 15889, 'sha256': '951cdf709e87849e13e86c72ee1c2e226a1b22a3951e927a63374bcbdf0f7891', 'base64': ''}]
          for row in rows:
              data=base64.b64decode(row['base64'],validate=True)
              assert len(data)==row['bytes'] and hashlib.sha256(data).hexdigest()==row['sha256']
              path=Path(os.environ['RUNNER_TEMP'])/row['name']
              assert not path.exists()
              path.write_bytes(data)
              print('IMGHOST_VITEST_SOURCE '+json.dumps({k:v for k,v in row.items() if k!='base64'},sort_keys=True),flush=True)
          PYTHON
          python3 -m py_compile "$RUNNER_TEMP/imghost-vitest-controller.py"
          test "$(node --version)" = v22.23.3
          test "$(npm --version)" = 10.9.9
          node --version
          npm --version
          timeout --kill-after=2s 20s python3 "$RUNNER_TEMP/imghost-vitest-controller.py" before
      - name: Generate unadopted lock and export conflict data before SAME rejection guard
        working-directory: imghost-source/backend/img-host
        shell: bash
        run: |
          set -euo pipefail
          timeout --kill-after=2s 120s npm install vitest@4.1.11 @vitest/coverage-v8@4.1.11 --package-lock-only --ignore-scripts --legacy-peer-deps --no-audit --no-fund
          timeout --kill-after=2s 20s python3 "$RUNNER_TEMP/imghost-vitest-controller.py" generated
      - name: Final host resource observation
        if: always()
        shell: bash
        run: |
          df -h /
          free -h
