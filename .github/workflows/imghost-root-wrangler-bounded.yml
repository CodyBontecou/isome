name: Imghost bounded root Wrangler virtual generation and fresh keyed audits
on:
  push:
    branches: [prep/qualification/imghost-root-wrangler-bounded-20261006]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      NPM_CONFIG_REGISTRY: https://registry.npmjs.org/
      NPM_CONFIG_UPDATE_NOTIFIER: 'false'
      NPM_CONFIG_FETCH_RETRIES: '0'
      NPM_CONFIG_FETCH_TIMEOUT: '30000'
    steps:
      - name: Cloud admission before downloads
        shell: bash
        run: |
          set -euo pipefail
          df -h /
          free -h
          python3 - <<'PYTHON'
          import os,shutil
          assert os.environ['RUNNER_ENVIRONMENT']=='github-hosted'
          assert os.environ['RUNNER_OS']=='Linux'
          assert os.environ['GITHUB_RUN_ATTEMPT']=='1'
          assert os.environ['GITHUB_SHA']==os.environ['GITHUB_WORKFLOW_SHA']
          assert shutil.disk_usage('/').free>=10*1024**3
          available=next(int(x.split()[1])*1024 for x in open('/proc/meminfo') if x.startswith('MemAvailable:'))
          assert available>=3*1024**3
          PYTHON
      - name: Exact PR10 four manifests only, no installed graph
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: CodyBontecou/imghost
          ref: ac727c69d1cd5861d121dbc5930c3c1473d2aac4
          path: imghost-source
          fetch-depth: 1
          lfs: false
          submodules: false
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /package.json
            /package-lock.json
            /backend/img-host/package.json
            /backend/img-host/package-lock.json
      - name: Pinned runtime family only, no npm ci or dependency installation
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.3'
          check-latest: false
      - name: Exact capture adapter, qualified runner, fresh bounded generation and audit workload
        shell: bash
        run: |
          set -euo pipefail
          test "$(node --version)" = v22.23.3
          test "$(npm --version)" = 10.9.9
          root="$RUNNER_TEMP/imghost-root-wrangler-bounded-instruments"
          test ! -e "$root"
          mkdir -m 700 "$root"
          python3 - "$root" <<'PYTHON'
          from pathlib import Path
          import sys,base64,hashlib,json
          root=Path(sys.argv[1])
          values=[('controller.py','',11484,'7f7ac893930c89c4f8ded621f1e6d8452c3ee27a9b6908297759922c85a4fc2f'),('runner.py','',7855,'36744856e6b2965ced89451ef15f72dcd39d3ca934dc32efb678830803889f3a'),('driver.py','',8078,'0251002f0239befb5c989f28f8fe7a214f3049a604b8c8a7d6cb8f6d13ec078b')]
          for name,encoded,size,sha in values:
              data=base64.b64decode(encoded,validate=True)
              assert len(data)==size and hashlib.sha256(data).hexdigest()==sha
              path=root/name
              assert not path.exists()
              path.write_bytes(data)
              print('IMGHOST_ROOT_BOUNDED_SOURCE '+json.dumps({'name':name,'bytes':size,'sha256':sha},sort_keys=True),flush=True)
          PYTHON
          timeout --kill-after=2s 12s python3 -m py_compile "$root/controller.py" "$root/runner.py" "$root/driver.py"
          python3 "$root/driver.py"
      - name: Final cloud resource observations
        if: always()
        shell: bash
        run: |
          df -h /
          free -h
