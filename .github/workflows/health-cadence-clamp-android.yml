name: Cadence clamp paired Android scheduler qualification
on:
  push:
    branches: [prep/qualification/health-cadence-clamp-android-20261006]
    paths: [.github/workflows/health-cadence-clamp-android.yml]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  named-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: '2'
      HEALTHMD_SOURCE_ROOT: ${{ github.workspace }}/healthmd-tested
      HEALTHMD_SOURCE_PINS_SHA256: b2e5b46cb8cf21f51991697a1a4c8761718f1dac3f74fb5b752d5d6aa9f3693d
    steps:
      - name: Resource preflight before checkout or downloads
        shell: bash
        run: |
          set -euo pipefail
          df -h /
          free -h
          uptime
          python3 - <<'PY'
          import shutil
          from pathlib import Path
          mem = dict(line.split(':', 1) for line in Path('/proc/meminfo').read_text().splitlines())
          free = shutil.disk_usage('/').free
          available = int(mem['MemAvailable'].split()[0])*1024
          if free < 15*1024**3 or available < 4*1024**3:
              raise RuntimeError('Cloud resource admission STOP')
          print('HEALTHMD_CLOUD_RESOURCE_ADMISSION', {'free_disk_bytes':free, 'available_memory_bytes':available, 'estimated_peak_additional_disk_bytes':12*1024**3, 'limits':'Estimate not preemptive allocation guarantee; keep 3GiB floor and recheck.'})
          PY
      - name: Checkout immutable Health base (runner-only patches follow)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: CodyBontecou/health-md
          ref: 5ebe91b6c5ec1b06bcb746fb95cd8015e75a4cd3
          path: healthmd-tested
          fetch-depth: 1
          persist-credentials: false
          lfs: false
          submodules: false
      - name: Materialize and verify qualification source literals
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, json, os, pathlib, platform, sys
          root = pathlib.Path(os.environ['RUNNER_TEMP']).resolve(strict=True)
          files = [
              ('healthmd-controller.py', 12962, '94e0a2ea3bcb0b555dc8ee5c2495bca890df7ee50dd99ede2b9ba2ffae28fc7c', ''),
              ('healthmd-named.init.gradle', 15471, '56590643b6c4bc54564a214880ba8b75444127a3cdd400c6e618684addb6c18e', ''),
              ('healthmd-correlator.py', 12040, '6ef98ae7c67523a3c6b74a1c3d2329cfb6d0e7d773b01d9a06f0e5e39e799ec7', ''),
              ('healthmd-named-registry.tsv', 3768, '8c444758684636a14e2b774146c3fa995d417779b5944761b3a70f21f8acfee9', ''),
              ('healthmd-source-pins.json', 2992, 'b2e5b46cb8cf21f51991697a1a4c8761718f1dac3f74fb5b752d5d6aa9f3693d', ''),
              ('healthmd-clamp-patches.json', 61876, '3f40528ab9061bcda7f57b59cacbf672c2e01df5ab1819129c786d7891679df8', ''),
          ]
          for name, size, expected, literal in files:
              body = base64.b64decode(literal, validate=True)
              digest = hashlib.sha256(body).hexdigest()
              if len(body) != size or digest != expected:
                  raise RuntimeError('Literal qualification source pin STOP')
              with (root/name).open('xb') as output:
                  output.write(body)
              print('HEALTHMD_QUALIFICATION_LITERAL', json.dumps({'file':name, 'bytes':len(body), 'sha256':digest}))
          print('HEALTHMD_QUALIFICATION_RUNTIME', json.dumps({'python':sys.version, 'executable':sys.executable, 'optimize':sys.flags.optimize, 'platform':platform.platform(), 'probe_sha':os.environ['GITHUB_SHA'], 'workflow_sha':os.environ['GITHUB_WORKFLOW_SHA'], 'run_id':os.environ['GITHUB_RUN_ID'], 'run_attempt':os.environ['GITHUB_RUN_ATTEMPT'], 'runner':os.environ['RUNNER_ENVIRONMENT'], 'limits':'Workflow/controller runtime observations, not test worker PID/binary attestation or outcomes.'}))
          PY
          python3 -m py_compile "$RUNNER_TEMP/healthmd-controller.py" "$RUNNER_TEMP/healthmd-correlator.py"
      - name: Independent source preflight before SDK and Rust installation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess
          root = pathlib.Path(os.environ['HEALTHMD_SOURCE_ROOT']).resolve(strict=True)
          manifest = json.loads((pathlib.Path(os.environ['RUNNER_TEMP'])/'healthmd-source-pins.json').read_bytes())
          for revision, expected in [('HEAD',manifest['tested_sha']), ('HEAD^{tree}',manifest['tested_tree'])]:
              observed = subprocess.check_output(['git','-C',str(root),'rev-parse',revision], timeout=15).decode().strip()
              if observed != expected:
                  raise RuntimeError('Immutable checkout revision STOP')
              print('HEALTHMD_SOURCE_PREFLIGHT_REVISION', revision, observed)
          for name, pin in manifest['source_pins'].items():
              path = root/name
              if path.is_symlink() or not path.is_file() or path.stat().st_size != pin['bytes'] or pin['bytes'] > 262144:
                  raise RuntimeError('Selected source preflight type/size STOP')
              with path.open('rb') as source:
                  body = source.read(262145)
              actual = hashlib.sha256(body).hexdigest()
              if len(body) != pin['bytes'] or actual != pin['sha256']:
                  raise RuntimeError('Selected immutable source byte STOP')
              print('HEALTHMD_SOURCE_PREFLIGHT_FILE', json.dumps({'path':name, 'bytes':len(body), 'sha256':actual}))
          PY
      - name: Apply only the two paired runner-source candidates
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_PATCH'
          import base64, hashlib, json, os, pathlib, subprocess
          temp = pathlib.Path(os.environ['RUNNER_TEMP']).resolve(strict=True)
          root = pathlib.Path(os.environ['HEALTHMD_SOURCE_ROOT']).resolve(strict=True)
          data = (temp/'healthmd-clamp-patches.json').read_bytes()
          if hashlib.sha256(data).hexdigest() != '3f40528ab9061bcda7f57b59cacbf672c2e01df5ab1819129c786d7891679df8':
              raise RuntimeError('Cloud patch literal pin STOP')
          patches = json.loads(data)
          expected = {'apps/android/app/src/main/java/com/healthmd/data/scheduler/ScheduledProfileEntry.kt', 'apps/android/app/src/test/java/com/healthmd/data/scheduler/ScheduledProfileOccurrenceMathTest.kt'}
          if len(patches) != 2 or {item['path'] for item in patches} != expected:
              raise RuntimeError('Exact two patch paths STOP')
          prepared = []
          for item in patches:
              path = root/item['path']
              if path.is_symlink() or not path.is_file() or path.resolve(strict=True) != path or path.stat().st_size != item['base_bytes']:
                  raise RuntimeError('Patch base type/size STOP')
              base = path.read_bytes()
              candidate = base64.b64decode(item['candidate_base64'], validate=True)
              old, new = item['old_text'].encode('utf-8'), item['new_text'].encode('utf-8')
              if hashlib.sha256(base).hexdigest() != item['base_sha256'] or len(candidate) != item['candidate_bytes'] or hashlib.sha256(candidate).hexdigest() != item['candidate_sha256']:
                  raise RuntimeError('Patch base/candidate bytes STOP')
              if base.count(old) != 1 or candidate.count(new) != 1 or base.replace(old,new,1) != candidate or candidate.replace(new,old,1) != base:
                  raise RuntimeError('Patch exact inverse STOP')
              prepared.append((path,candidate,item))
          for path,candidate,item in prepared:
              path.write_bytes(candidate)
              if path.read_bytes() != candidate:
                  raise RuntimeError('Patch written byte readback STOP')
              print('HEALTHMD_CADENCE_CANDIDATE_APPLIED', json.dumps({'path':item['path'],'base_sha256':item['base_sha256'],'candidate_sha256':item['candidate_sha256'],'bytes':len(candidate),'literal_inverse':True,'limits':'Two runner-only patches, not product commits or acceptance.'}))
          actual = subprocess.check_output(['git','-C',str(root),'diff','--name-only'],timeout=15).decode('utf-8').splitlines()
          if set(actual) != expected:
              raise RuntimeError('Exact two changed runner paths STOP')
          PY_PATCH
      - name: Select Java 17 test/build toolchain
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
          check-latest: false
      - name: Android SDK tools (no emulator)
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: platform-tools
      - name: Gradle wrapper validation and read-only cache
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          cache-read-only: true
          dependency-graph: disabled
          build-scan-publish: false
      - name: Install real pinned Android and Rust prerequisites
        shell: bash
        run: |
          set -euo pipefail
          df -h /
          free -h
          sdkmanager "platforms;android-36" "build-tools;35.0.0" "ndk;27.1.12297006"
          printf 'ANDROID_NDK_HOME=%s/ndk/27.1.12297006\nANDROID_NDK_ROOT=%s/ndk/27.1.12297006\n' "$ANDROID_SDK_ROOT" "$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          rustup toolchain install 1.88.0 --profile minimal
          rustup target add --toolchain 1.88.0 aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android
          rustup run 1.88.0 cargo install cargo-ndk --version 4.1.2 --locked
          java -version
          rustup run 1.88.0 rustc -Vv
          rustup run 1.88.0 cargo ndk --version
      - name: Resource floor before real Play build and 29 named scheduler tests
        shell: bash
        run: |
          set -euo pipefail
          df -h /
          free -h
          python3 - <<'PY'
          import shutil
          from pathlib import Path
          mem = dict(line.split(':', 1) for line in Path('/proc/meminfo').read_text().splitlines())
          if shutil.disk_usage('/').free < 3*1024**3 or int(mem['MemAvailable'].split()[0])*1024 < 2*1024**3:
              raise RuntimeError('Cloud pre-build resource floor STOP')
          PY
          python3 "$RUNNER_TEMP/healthmd-controller.py" play
      - name: Resource floor before real F-Droid build and 29 named scheduler tests
        shell: bash
        run: |
          set -euo pipefail
          df -h /
          free -h
          python3 - <<'PY'
          import shutil
          from pathlib import Path
          mem = dict(line.split(':', 1) for line in Path('/proc/meminfo').read_text().splitlines())
          if shutil.disk_usage('/').free < 3*1024**3 or int(mem['MemAvailable'].split()[0])*1024 < 2*1024**3:
              raise RuntimeError('Cloud pre-build resource floor STOP')
          PY
          python3 "$RUNNER_TEMP/healthmd-controller.py" fdroid
      - name: Final hosted resource observations (not cleanup/goal proof)
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          df -h /
          free -h
          echo 'HEALTHMD_QUALIFICATION_BOUNDARY: immutable base plus two byte-pinned runner-only candidates and 29 selected synthetic JVM tests per flavor; no signing/emulator/phone/Wear/deploy/release/product artifact retention. Missing/failed/cancelled incomplete outputs are not PASS; job/provider cleanup or physical device/receiver/security/overnight/goal completion remains unproved.'
