name: Health169 read-only cloud Mac resource observations
on:
  push:
    branches: [prep/qualification/health-169-mac-resource-20261006]
permissions:
  contents: read
jobs:
  resources:
    runs-on: macos-26
    timeout-minutes: 3
    steps:
      - name: Materialize exact resource observer (no source checkout)
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYTHON'
          from pathlib import Path
          import os,base64,hashlib,json
          root=Path(os.environ['RUNNER_TEMP'])/'health169-mac-resource-material'
          assert not root.exists()
          root.mkdir(mode=0o700)
          rows=[{'name': 'runner.py', 'bytes': 7443, 'sha256': '5d9d1b4875bca9685c490445c59367d0f5917c7676cd6cd60d2939a48c5f19af', 'base64': ''}, {'name': 'controller.py', 'bytes': 3295, 'sha256': 'ae45868ac183708433e83a1376d4940052f0f59abd7b8fddddc7e31962af4211', 'base64': ''}]
          for row in rows:
              data=base64.b64decode(row['base64'],validate=True)
              assert len(data)==row['bytes'] and hashlib.sha256(data).hexdigest()==row['sha256']
              (root/row['name']).write_bytes(data)
              print('HEALTHMD_MAC_RESOURCE_SOURCE '+json.dumps({k:v for k,v in row.items() if k!='base64'},sort_keys=True),flush=True)
          PYTHON
          python3 -m py_compile "$RUNNER_TEMP/health169-mac-resource-material/runner.py" "$RUNNER_TEMP/health169-mac-resource-material/controller.py"
      - name: Read-only vm_stat, physical memory and pressure query
        shell: bash
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/health169-mac-resource-material/controller.py"
