name: Health 174 immutable Android named-test qualification
on:
  push:
    branches: [prep/qualification/health-174-named-android-20261005]
    paths: [.github/workflows/health-174-named-android-qualification.yml]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  named-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: '2'
      HEALTHMD_SOURCE_ROOT: ${{ github.workspace }}/healthmd-tested
      HEALTHMD_SOURCE_PINS_SHA256: 230d934403b30829f13fe908a225fc40c426311f6928aefe699d887745c3e4a1
    steps:
      - name: Resource preflight before checkout or downloads
        shell: bash
        run: |
          set -euo pipefail
          df -h /
          free -h
          uptime
          python3 - <<'PY'
          import shutil
          from pathlib import Path
          mem = dict(line.split(':', 1) for line in Path('/proc/meminfo').read_text().splitlines())
          free = shutil.disk_usage('/').free
          available = int(mem['MemAvailable'].split()[0])*1024
          if free < 15*1024**3 or available < 4*1024**3:
              raise RuntimeError('Cloud resource admission STOP')
          print('HEALTHMD_CLOUD_RESOURCE_ADMISSION', {'free_disk_bytes':free, 'available_memory_bytes':available, 'estimated_peak_additional_disk_bytes':12*1024**3, 'limits':'Estimate not preemptive allocation guarantee; keep 3GiB floor and recheck.'})
          PY
      - name: Checkout immutable Health source read-only
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: CodyBontecou/health-md
          ref: 88e508d775444161501fd0af6a6a20ca085e8c08
          path: healthmd-tested
          fetch-depth: 1
          persist-credentials: false
          lfs: false
          submodules: false
      - name: Materialize and verify qualification source literals
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, json, os, pathlib, platform, sys
          root = pathlib.Path(os.environ['RUNNER_TEMP']).resolve(strict=True)
          files = [
              ('healthmd-controller.py', 12427, '526cc9677aa8804884b275e5ed72264bdd0f13404d4be3c070b8c4e99952e6d5', ''),
              ('healthmd-named.init.gradle', 15578, '06a2f55334575a851de32e619a3920c82a10607314da351d8e26c04d00cc9940', ''),
              ('healthmd-correlator.py', 12157, '2a3b5fa643a4c481966dbc64117912201d4fbf3854920350bc18eba4087b19ad', ''),
              ('healthmd-named-registry.tsv', 4320, '529080b733ff0b5f3441b87f5a07a813d686445ff4d184e2e9be0d136c5ec5ec', ''),
              ('healthmd-source-pins.json', 4396, '230d934403b30829f13fe908a225fc40c426311f6928aefe699d887745c3e4a1', ''),
          ]
          for name, size, expected, literal in files:
              body = base64.b64decode(literal, validate=True)
              digest = hashlib.sha256(body).hexdigest()
              if len(body) != size or digest != expected:
                  raise RuntimeError('Literal qualification source pin STOP')
              with (root/name).open('xb') as output:
                  output.write(body)
              print('HEALTHMD_QUALIFICATION_LITERAL', json.dumps({'file':name, 'bytes':len(body), 'sha256':digest}))
          print('HEALTHMD_QUALIFICATION_RUNTIME', json.dumps({'python':sys.version, 'executable':sys.executable, 'optimize':sys.flags.optimize, 'platform':platform.platform(), 'probe_sha':os.environ['GITHUB_SHA'], 'workflow_sha':os.environ['GITHUB_WORKFLOW_SHA'], 'run_id':os.environ['GITHUB_RUN_ID'], 'run_attempt':os.environ['GITHUB_RUN_ATTEMPT'], 'runner':os.environ['RUNNER_ENVIRONMENT'], 'limits':'Workflow/controller runtime observations, not test worker PID/binary attestation or outcomes.'}))
          PY
          python3 -m py_compile "$RUNNER_TEMP/healthmd-controller.py" "$RUNNER_TEMP/healthmd-correlator.py"
      - name: Independent source preflight before SDK and Rust installation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess
          root = pathlib.Path(os.environ['HEALTHMD_SOURCE_ROOT']).resolve(strict=True)
          manifest = json.loads((pathlib.Path(os.environ['RUNNER_TEMP'])/'healthmd-source-pins.json').read_bytes())
          for revision, expected in [('HEAD',manifest['tested_sha']), ('HEAD^{tree}',manifest['tested_tree'])]:
              observed = subprocess.check_output(['git','-C',str(root),'rev-parse',revision], timeout=15).decode().strip()
              if observed != expected:
                  raise RuntimeError('Immutable checkout revision STOP')
              print('HEALTHMD_SOURCE_PREFLIGHT_REVISION', revision, observed)
          for name, pin in manifest['source_pins'].items():
              path = root/name
              if path.is_symlink() or not path.is_file() or path.stat().st_size != pin['bytes'] or pin['bytes'] > 262144:
                  raise RuntimeError('Selected source preflight type/size STOP')
              with path.open('rb') as source:
                  body = source.read(262145)
              actual = hashlib.sha256(body).hexdigest()
              if len(body) != pin['bytes'] or actual != pin['sha256']:
                  raise RuntimeError('Selected immutable source byte STOP')
              print('HEALTHMD_SOURCE_PREFLIGHT_FILE', json.dumps({'path':name, 'bytes':len(body), 'sha256':actual}))
          PY
      - name: Select Java 17 test/build toolchain
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
          check-latest: false
      - name: Android SDK tools (no emulator)
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: platform-tools
      - name: Gradle wrapper validation and read-only cache
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          cache-read-only: true
          dependency-graph: disabled
          build-scan-publish: false
      - name: Install real pinned Android and Rust prerequisites
        shell: bash
        run: |
          set -euo pipefail
          df -h /
          free -h
          sdkmanager "platforms;android-36" "build-tools;35.0.0" "ndk;27.1.12297006"
          printf 'ANDROID_NDK_HOME=%s/ndk/27.1.12297006\nANDROID_NDK_ROOT=%s/ndk/27.1.12297006\n' "$ANDROID_SDK_ROOT" "$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          rustup toolchain install 1.88.0 --profile minimal
          rustup target add --toolchain 1.88.0 aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android
          rustup run 1.88.0 cargo install cargo-ndk --version 4.1.2 --locked
          java -version
          rustup run 1.88.0 rustc -Vv
          rustup run 1.88.0 cargo ndk --version
      - name: Resource floor before real Play build and 38 named tests
        shell: bash
        run: |
          set -euo pipefail
          df -h /
          free -h
          python3 - <<'PY'
          import shutil
          from pathlib import Path
          mem = dict(line.split(':', 1) for line in Path('/proc/meminfo').read_text().splitlines())
          if shutil.disk_usage('/').free < 3*1024**3 or int(mem['MemAvailable'].split()[0])*1024 < 2*1024**3:
              raise RuntimeError('Cloud pre-build resource floor STOP')
          PY
          python3 "$RUNNER_TEMP/healthmd-controller.py" play
      - name: Resource floor before real F-Droid build and 38 named tests
        shell: bash
        run: |
          set -euo pipefail
          df -h /
          free -h
          python3 - <<'PY'
          import shutil
          from pathlib import Path
          mem = dict(line.split(':', 1) for line in Path('/proc/meminfo').read_text().splitlines())
          if shutil.disk_usage('/').free < 3*1024**3 or int(mem['MemAvailable'].split()[0])*1024 < 2*1024**3:
              raise RuntimeError('Cloud pre-build resource floor STOP')
          PY
          python3 "$RUNNER_TEMP/healthmd-controller.py" fdroid
      - name: Final hosted resource observations (not cleanup/goal proof)
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          df -h /
          free -h
          echo 'HEALTHMD_QUALIFICATION_BOUNDARY: read-only immutable source and selected synthetic JVM tests; no signing/emulator/phone/Wear/deploy/release/product artifact retention. Missing/failed/cancelled incomplete outputs are not PASS; job/provider cleanup or physical device/receiver/security/overnight/goal completion remains unproved.'
