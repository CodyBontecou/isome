steps:
  - launch:
      native: com.bontecou.isome
      ios:
        app: com.bontecou.isome
        args:
          - -hasCompletedOnboarding
          - NO
          - --onboarding-page=6
  - tool: await-ui-element
    args:
      condition: visible
      selector:
        text: Start tracking immediately
  - await: { idle: true }
  - echo: Always location permission is pre-granted on the dedicated simulator. The
      tracking toggle defaults off (value 0). Get Started is at (0.5975,0.912);
      native footer id/text selectors fail as documented in
      onboarding-scrawl-formats. Expect the map with Start tracking available.
  - tool: gesture-tap
    args:
      x: 0.5975
      y: 0.912
  - tool: await-ui-element
    args:
      condition: visible
      selector:
        text: Start tracking
        role: Button
  - await: { idle: true }
