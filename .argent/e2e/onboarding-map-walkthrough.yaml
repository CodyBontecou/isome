steps:
- launch:
    native: com.bontecou.isome
    ios:
      app: com.bontecou.isome
      args:
      - -hasCompletedOnboarding
      - 'NO'
      - --onboarding-page=0
- tool: await-ui-element
  args:
    condition: visible
    selector:
      text: Every day
- await:
    idle: true
- echo: Next at (0.5, 0.912). All point taps use iPhone 18 Pro portrait geometry.
    Native runner ids and text failed probe assertions despite accessibility exposing
    stable ids; raw accessibility outcome checks are retained.
- tool: gesture-tap
  args:
    x: 0.5
    y: 0.912
- tool: await-ui-element
  args:
    condition: visible
    selector:
      text: The shape
- await:
    idle: true
- echo: Tap Next to view the route. SwiftUI ids/text are present in accessibility
    but absent from the working native runner tree; id and text probe assertions both
    failed. Coordinates are simulator-size-specific.
- tool: gesture-tap
  args:
    x: 0.597
    y: 0.912
- tool: await-ui-element
  args:
    condition: visible
    selector:
      text: Routes with start
- await:
    idle: true
- echo: Tap Next to show exports.
- tool: gesture-tap
  args:
    x: 0.597
    y: 0.912
- tool: await-ui-element
  args:
    condition: visible
    selector:
      text: JSON, CSV
- await:
    idle: true
- echo: Tap Next to show photo moments before location permission setup.
- tool: gesture-tap
  args:
    x: 0.597
    y: 0.912
- tool: await-ui-element
  args:
    condition: visible
    selector:
      text: Your photographs
- await:
    idle: true
- echo: Tap Next to reach permission setup after the feature previews.
- tool: gesture-tap
  args:
    x: 0.597
    y: 0.912
- tool: await-ui-element
  args:
    condition: visible
    selector:
      text: Record your days around
- await:
    idle: true
- echo: Tap the finish progress dot at (0.829, 0.84).
- tool: gesture-tap
  args:
    x: 0.829
    y: 0.84
- tool: await-ui-element
  args:
    condition: visible
    selector:
      text: next chapter
- await:
    idle: true
- echo: Tap Back at (0.142, 0.912) to return from finish to permission setup.
- tool: gesture-tap
  args:
    x: 0.142
    y: 0.912
- tool: await-ui-element
  args:
    condition: visible
    selector:
      text: Record your days around
- await:
    idle: true
